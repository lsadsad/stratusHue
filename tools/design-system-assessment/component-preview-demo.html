<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component Preview System Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f8f9fa;
            transition: background-color 200ms ease-out, color 200ms ease-out;
        }

        .demo-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .demo-header {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e1e5e9;
        }

        .demo-title {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: #333;
        }

        .demo-description {
            color: #666;
            margin: 0;
        }

        .demo-controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .demo-button {
            padding: 8px 16px;
            border: 1px solid #e1e5e9;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 150ms ease-out;
        }

        .demo-button:hover {
            background: #f8f9fa;
        }

        .demo-button.active {
            background: #007acc;
            color: white;
            border-color: #007acc;
        }

        #component-preview-container {
            border: 1px solid #e1e5e9;
            border-radius: 4px;
            overflow: hidden;
            background: white;
        }

        /* Import stratusHue design tokens */
        :root {
            /* Spacing System */
            --spacing-xs: 2px;
            --spacing-sm: 4px;
            --spacing-md: 6px;
            --spacing-lg: 8px;
            --spacing-xl: 10px;
            --spacing-xxl: 12px;

            /* Typography */
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            --font-size-xs: 10px;
            --font-size-sm: 11px;
            --font-size-md: 12px;
            --font-size-lg: 14px;

            --font-weight-light: 300;
            --font-weight-normal: 400;
            --font-weight-medium: 500;
            --font-weight-semibold: 600;
            --font-weight-bold: 700;

            /* Component Sizes */
            --button-height-sm: 16px;
            --button-height-md: 24px;
            --button-height-lg: 32px;
            --icon-size-xs: 6px;
            --icon-size-sm: 8px;
            --icon-size-md: 10px;
            --icon-size-lg: 16px;
            --icon-size-xl: 18px;

            /* Border Radius */
            --border-radius-xs: 2px;
            --border-radius-sm: 3px;
            --border-radius-md: 4px;
            --border-radius-lg: 6px;
            --border-radius-xl: 8px;

            /* Base Theme Colors */
            --theme-bg-primary: #ffffff;
            --theme-bg-secondary: #f8f9fa;
            --theme-bg-elevated: #ffffff;
            --theme-bg-hover: #f0f0f0;
            --theme-bg-active: #e9ecef;

            --theme-text-primary: #333333;
            --theme-text-secondary: #666666;
            --theme-text-muted: #999999;
            --theme-text-disabled: #cccccc;

            --theme-border-primary: #e1e5e9;
            --theme-border-secondary: #f0f0f0;

            --theme-interactive-hover: #f8f9fa;
            --theme-interactive-active: #e9ecef;
            --theme-interactive-disabled: #f8f9fa;

            --theme-info: #007acc;
            --theme-success: #4ade80;
            --theme-warning: rgba(255, 193, 7, 0.9);
            --theme-error: #ff6b6b;

            /* Additional theme colors for accuracy */
            --theme-accent-red: rgba(255, 107, 107, 0.15);
            --theme-accent-blue: rgba(111, 176, 255, 0.08);
            --theme-border-translucent: rgba(0, 0, 0, 0.2);
            --theme-border-soft: rgba(0, 0, 0, 0.24);
            --letter-spacing-tight: 0.5px;
            --border-radius-pill: 999px;

            /* Transitions */
            --transition-fast: 150ms ease-out;
            --transition-normal: 200ms ease-out;
            --transition-slow: 300ms ease-out;

            /* Elevation */
            --elevation-nudge: 1px;
        }

        /* Cybertron Theme */
        [data-theme="cybertron"] {
            --theme-bg-primary: #1a1a1a;
            --theme-bg-secondary: #2a2a2a;
            --theme-bg-elevated: #2a2a2a;
            --theme-bg-hover: #3a3a3a;
            --theme-bg-active: #4a4a4a;

            --theme-text-primary: #00ff88;
            --theme-text-secondary: #88ffaa;
            --theme-text-muted: #66cc77;
            --theme-text-disabled: #444444;

            --theme-border-primary: #00ff88;
            --theme-border-secondary: #333333;

            --theme-interactive-hover: #3a3a3a;
            --theme-interactive-active: #4a4a4a;
            --theme-interactive-disabled: #2a2a2a;
        }

        /* Figma Light Theme */
        [data-theme="figma-light"] {
            --theme-bg-primary: #ffffff;
            --theme-bg-secondary: #f0f0f0;
            --theme-bg-elevated: #ffffff;
            --theme-bg-hover: #e5e5e5;
            --theme-bg-active: #d9d9d9;

            --theme-text-primary: #1e1e1e;
            --theme-text-secondary: #757575;
            --theme-text-muted: #a8a8a8;
            --theme-text-disabled: #cccccc;

            --theme-border-primary: #e5e5e5;
            --theme-border-secondary: #f0f0f0;

            --theme-interactive-hover: #e5e5e5;
            --theme-interactive-active: #d9d9d9;
            --theme-interactive-disabled: #f0f0f0;
        }

        /* Figma Dark Theme */
        [data-theme="figma-dark"] {
            --theme-bg-primary: #2c2c2c;
            --theme-bg-secondary: #3c3c3c;
            --theme-bg-elevated: #1c1c1c;
            --theme-bg-hover: rgba(255, 255, 255, 0.08);
            --theme-bg-active: rgba(24, 160, 251, 0.15);

            --theme-text-primary: #ffffff;
            --theme-text-secondary: #cccccc;
            --theme-text-muted: rgba(255, 255, 255, 0.6);
            --theme-text-disabled: rgba(255, 255, 255, 0.3);

            --theme-border-primary: #4c4c4c;
            --theme-border-secondary: #5c5c5c;

            --theme-interactive-hover: rgba(255, 255, 255, 0.08);
            --theme-interactive-active: rgba(24, 160, 251, 0.15);
            --theme-interactive-disabled: #2c2c2c;
        }

        /* Component Styles - Base Button */
        .btn-base {
            padding: var(--spacing-sm) var(--spacing-lg);
            border: 1px solid var(--theme-border-primary);
            border-radius: var(--border-radius-md);
            background: var(--theme-bg-primary);
            color: var(--theme-text-primary);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: var(--button-height-md);
        }

        .btn-base:hover {
            background: var(--theme-interactive-hover);
            transform: translateY(calc(var(--elevation-nudge) * -1));
        }

        .btn-base:active {
            background: var(--theme-interactive-active);
            transform: translateY(0);
        }

        .btn-base:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Clear Action & Save Bookmark Buttons (Drop/Remove) */
        .clear-action,
        .save-bookmark {
            border: none;
            cursor: pointer;
            font-family: var(--font-family);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 calc(var(--spacing-lg) * 2);
            font-size: var(--spacing-xl);
            border-radius: var(--border-radius-pill);
            background: var(--theme-bg-hover);
            color: var(--theme-text-primary);
            font-weight: var(--font-weight-normal);
            justify-content: space-between;
            opacity: 1;
            height: var(--button-height-md);
            box-sizing: border-box;
            transition: all var(--transition-fast);
        }

        .save-bookmark {
            transition: none !important;
        }

        .clear-action:hover,
        .save-bookmark:hover {
            background: var(--theme-bg-hover);
            border: 1px solid var(--theme-info);
            color: var(--theme-info);
        }

        .clear-action:active,
        .save-bookmark:active {
            background: var(--theme-interactive-active);
            color: var(--theme-text-primary);
        }

        .action-text {
            flex: 1;
            text-align: center;
            font-weight: inherit;
            color: var(--theme-text-primary);
            letter-spacing: 0.55px;
            transition: color var(--transition-normal);
        }

        .clear-action:hover .action-text,
        .save-bookmark:hover .action-text {
            color: var(--theme-info);
        }

        /* Bookmark Remove Button */
        .bookmark-remove {
            color: var(--theme-text-primary);
            background: transparent;
            border: none;
            font-size: var(--icon-size-md);
            cursor: pointer;
            padding: 0;
            margin: 0;
            opacity: 0;
            pointer-events: none;
            width: var(--button-height-md);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            right: 0;
            top: 0;
            transform: none;
            transition: none !important;
            border-radius: 0 var(--border-radius-lg) var(--border-radius-lg) 0;
        }

        .bookmark-item:hover .bookmark-remove {
            opacity: 1;
            pointer-events: auto;
            color: var(--theme-text-primary);
            background: transparent;
        }

        .bookmark-remove:hover {
            background: var(--theme-error);
            color: var(--theme-text-primary);
            font-weight: var(--font-weight-semibold);
            opacity: 1;
        }

        /* Action Button */
        .action-btn {
            padding: var(--spacing-sm);
            border: 1px solid var(--theme-border-primary);
            border-radius: var(--border-radius-md);
            background: var(--theme-bg-secondary);
            color: var(--theme-text-primary);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: var(--button-height-md);
            height: var(--button-height-md);
        }

        .action-btn:hover {
            background: var(--theme-interactive-hover);
            transform: translateY(calc(var(--elevation-nudge) * -1));
        }

        .action-btn:active {
            background: var(--theme-interactive-active);
            transform: translateY(0);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .action-btn[data-state="loading"]::after {
            content: '';
            width: 12px;
            height: 12px;
            border: 2px solid var(--theme-border-primary);
            border-top: 2px solid var(--theme-text-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: absolute;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Emoji Button */
        .emoji-button {
            padding: var(--spacing-sm);
            border: 1px solid var(--theme-border-primary);
            border-radius: var(--border-radius-md);
            background: var(--theme-bg-primary);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: var(--button-height-md);
            height: var(--button-height-md);
            font-size: var(--font-size-md);
        }

        .emoji-button:hover {
            background: var(--theme-interactive-hover);
            transform: scale(1.1);
        }

        .emoji-button:active {
            background: var(--theme-interactive-active);
            transform: scale(0.95);
        }

        .emoji-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .emoji-button[aria-pressed="true"] {
            background: var(--theme-interactive-active);
            border-color: var(--theme-info);
        }

        /* Navigation Button */
        .nav-button {
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--theme-border-primary);
            border-radius: var(--border-radius-md);
            background: var(--theme-bg-primary);
            color: var(--theme-text-primary);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: var(--button-height-lg);
            font-size: var(--font-size-xs);
            gap: 2px;
        }

        .nav-button:hover:not(:disabled) {
            background: var(--theme-interactive-hover);
            transform: translateY(calc(var(--elevation-nudge) * -1));
        }

        .nav-button:active:not(:disabled) {
            background: var(--theme-interactive-active);
            transform: translateY(0);
        }

        .nav-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .nav-button-wide {
            grid-column: span 2;
            flex-direction: row;
            gap: var(--spacing-sm);
        }

        .nav-icon {
            font-size: var(--icon-size-md);
            line-height: 1;
        }

        .nav-label {
            font-size: var(--font-size-xs);
            line-height: 1;
        }

        /* Theme Option */
        .theme-option {
            display: block;
            position: relative;
            padding: var(--spacing-md);
            border: 1px solid var(--theme-border-primary);
            border-radius: var(--border-radius-md);
            background: var(--theme-bg-primary);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .theme-option:hover {
            background: var(--theme-bg-hover);
            border-color: var(--theme-info);
        }

        .theme-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .theme-option input[type="radio"]:checked+.theme-option-content {
            background: var(--theme-interactive-active);
            border-color: var(--theme-info);
        }

        .theme-option-content {
            display: block;
        }

        .theme-name {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            color: var(--theme-text-primary);
            margin-bottom: 2px;
        }

        .theme-description {
            font-size: var(--font-size-xs);
            color: var(--theme-text-secondary);
        }

        /* Section Header */
        .section-header {
            width: 100%;
            padding: var(--spacing-md) var(--spacing-lg);
            border: none;
            border-radius: var(--border-radius-md);
            background: var(--theme-bg-secondary);
            color: var(--theme-text-primary);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            text-align: left;
        }

        .section-header:hover {
            background: var(--theme-bg-hover);
        }

        .section-header .icon-container {
            position: relative;
            display: inline-block;
            width: var(--icon-size-lg);
            height: var(--icon-size-lg);
        }

        .section-header .tag-icon {
            font-size: var(--icon-size-md);
            transition: opacity var(--transition-fast);
        }

        .section-header .arrow {
            position: absolute;
            top: 0;
            left: 0;
            font-size: var(--icon-size-lg);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .section-header:hover .arrow {
            opacity: 1;
        }

        .section-header:hover .tag-icon {
            opacity: 0;
        }

        .section-header[aria-expanded="true"] .arrow::before {
            content: "−";
        }

        .section-header[aria-expanded="false"] .arrow::before {
            content: "+";
        }

        .header-title {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
        }

        .header-subtitle {
            font-size: var(--font-size-xs);
            color: var(--theme-text-secondary);
            margin-top: 2px;
        }

        /* Bookmark Item */
        .bookmark-item {
            display: flex;
            align-items: center;
            margin-bottom: 0;
            font-size: var(--spacing-xl);
            background: transparent;
            border-radius: 0;
            padding: var(--spacing-lg) var(--spacing-xl);
            padding-right: calc(var(--spacing-lg) + var(--spacing-xl));
            cursor: pointer;
            transition: all var(--transition-normal);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .bookmark-item:hover {
            background: var(--theme-bg-secondary);
            border-radius: var(--border-radius-lg);
        }

        .bookmark-item:active {
            background: var(--theme-interactive-hover);
        }

        .bookmark-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
            cursor: pointer;
            min-width: 0;
        }

        .bookmark-name {
            font-weight: normal;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--theme-text-primary);
            letter-spacing: 0.05em;
            max-width: 100%;
            min-width: 0;
        }

        .bookmark-page {
            font-size: var(--icon-size-sm);
            color: var(--theme-text-primary);
            font-weight: normal;
            margin-top: var(--spacing-sm);
            opacity: 0.6;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.05em;
            white-space: nowrap;
            max-width: 100%;
            min-width: 0;
        }

        .bookmark-action {
            padding: var(--spacing-sm);
            border: 1px solid var(--theme-border-primary);
            border-radius: var(--border-radius-sm);
            background: var(--theme-bg-secondary);
            color: var(--theme-text-primary);
            cursor: pointer;
            transition: all var(--transition-fast);
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bookmark-action:hover {
            background: var(--theme-interactive-hover);
        }

        /* Navigation Grid */
        .navigation-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-sm);
            padding: var(--spacing-md);
            background: var(--theme-bg-secondary);
            border-radius: var(--border-radius-md);
        }

        /* Text Demo */
        .text-demo {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            color: var(--theme-text-primary);
        }

        /* Component Preview Tables */
        .component-preview__tables {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .component-preview__category-header {
            margin: 0 0 var(--spacing-sm) 0;
            font-size: var(--font-size-lg);
            color: var(--theme-text-primary);
        }

        .component-preview__table {
            width: 100%;
            border-collapse: collapse;
            background: var(--theme-bg-primary);
            border: 1px solid var(--theme-border-primary);
            border-radius: var(--border-radius-md);
            overflow: hidden;
        }

        .component-preview__table thead th {
            background: var(--theme-bg-secondary);
            color: var(--theme-text-primary);
            text-align: left;
            padding: var(--spacing-sm) var(--spacing-md);
            border-bottom: 1px solid var(--theme-border-primary);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .component-preview__table th,
        .component-preview__table td {
            padding: var(--spacing-sm) var(--spacing-md);
            border-bottom: 1px solid var(--theme-border-secondary);
            vertical-align: top;
            color: var(--theme-text-primary);
            font-size: var(--font-size-sm);
        }

        .component-preview__table tbody tr:last-child td {
            border-bottom: none;
        }

        .component-preview__cell-demo {
            background: var(--theme-bg-elevated);
            border: 1px solid var(--theme-border-secondary);
            border-radius: var(--border-radius-sm);
            display: inline-block;
            padding: var(--spacing-sm);
        }

        .component-preview__cell-code {
            background: var(--theme-bg-elevated);
            border: 1px dashed var(--theme-border-secondary);
            border-radius: var(--border-radius-sm);
            padding: var(--spacing-sm);
            color: var(--theme-text-secondary);
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            font-size: var(--font-size-xs);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .component-preview--compact .component-preview__table th,
        .component-preview--compact .component-preview__table td {
            padding: var(--spacing-xs) var(--spacing-sm);
            font-size: var(--font-size-xs);
        }

        /* Category collapse bar */
        .component-preview__category-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-sm);
            background: var(--theme-bg-secondary);
            border: 1px solid var(--theme-border-primary);
            border-radius: var(--border-radius-md);
            padding: var(--spacing-sm) var(--spacing-md);
        }

        .component-preview__category-title {
            margin: 0;
            font-size: var(--font-size-lg);
            color: var(--theme-text-primary);
        }

        .component-preview__category-toggle {
            border: 1px solid var(--theme-border-primary);
            background: var(--theme-bg-primary);
            color: var(--theme-text-primary);
            border-radius: var(--border-radius-sm);
            padding: var(--spacing-xs) var(--spacing-sm);
            cursor: pointer;
            font-size: var(--font-size-xs);
        }

        /* Theme transitions for body */
        body {
            transition: background-color 200ms ease-out, color 200ms ease-out;
        }

        [data-theme="cybertron"] body {
            background: #0a0a0a;
            color: var(--theme-text-primary);
        }

        [data-theme="cybertron"] .demo-container {
            background: var(--theme-bg-primary);
            border: 1px solid var(--theme-border-primary);
        }

        [data-theme="figma-light"] body {
            background: #f5f5f5;
        }

        [data-theme="figma-light"] .demo-container {
            background: var(--theme-bg-primary);
        }

        [data-theme="figma-dark"] body {
            background: #1c1c1c;
        }

        [data-theme="figma-dark"] .demo-container {
            background: var(--theme-bg-primary);
            border: 1px solid var(--theme-border-primary);
        }

        /* Demo two-column layout */
        .demo-main {
            display: grid;
            grid-template-columns: 1fr max-content;
            gap: 20px;
            align-items: start;
        }

        .demo-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

                        option.value = theme.name;
                        option.textContent = theme.displayName;
                        option.selected = theme.name === this.currentTheme;
                        select.appendChild(option);
                    });

                    select.addEventListener('change', (e) => {
                        this.switchTheme(e.target.value);
                    });

                    switcher.appendChild(label);
                    switcher.appendChild(select);
                    container.appendChild(switcher);

                    // Create tables container
                    const tables = document.createElement('div');
                    tables.className = 'component-preview__tables';
                    if (this.options.compactMode) {
                        tables.classList.add('component-preview--compact');
                    }

                    // Group by category and render tables
                    const categories = this.groupByCategory(components);
                    Object.entries(categories).forEach(([categoryName, categoryComponents]) => {
                        if (categoryComponents.length === 0) return;

                        const categoryWrapper = document.createElement('div');
                        categoryWrapper.className = 'component-preview__category';

                        const bar = document.createElement('div');
                        bar.className = 'component-preview__category-bar';
                        const categoryTitle = document.createElement('h3');
                        categoryTitle.className = 'component-preview__category-title';
                        categoryTitle.textContent = categoryName.charAt(0).toUpperCase() + categoryName.slice(1);
                        const toggleBtn = document.createElement('button');
                        toggleBtn.className = 'component-preview__category-toggle';
                        const isCollapsed = collapsedCategories.has(categoryName);
                        toggleBtn.textContent = isCollapsed ? 'Expand' : 'Collapse';
                        toggleBtn.addEventListener('click', () => {
                            if (collapsedCategories.has(categoryName)) {
                                collapsedCategories.delete(categoryName);
                            } else {
                                collapsedCategories.add(categoryName);
                            }
                            this.render();
                        });
                        bar.appendChild(categoryTitle);
                        bar.appendChild(toggleBtn);
                        categoryWrapper.appendChild(bar);

                        if (!isCollapsed) {
                            const table = this.createCategoryTable(categoryComponents);
                            categoryWrapper.appendChild(table);
                        }

                        tables.appendChild(categoryWrapper);
                    });

                    container.appendChild(tables);
                },

                groupByCategory(components) {
                    const categories = {
                        buttons: [],
                        inputs: [],
                        containers: [],
                        navigation: [],
                        typography: [],
                        other: []
                    };

                    components.forEach(component => {
                        if (categories[component.category]) {
                            categories[component.category].push(component);
                        } else {
                            categories.other.push(component);
                        }
                    });

                    return categories;
                },

                createComponentCard(component) {
                    // Unused in table layout, retained for reference
                    const placeholder = document.createElement('div');
                    return placeholder;
                },

                createCategoryTable(categoryComponents) {
                    const wrapper = document.createElement('div');
                    const table = document.createElement('table');
                    table.className = 'component-preview__table';

                    const thead = document.createElement('thead');
                    const headRow = document.createElement('tr');

                    const thComponent = document.createElement('th');
                    thComponent.textContent = 'Component';
                    headRow.appendChild(thComponent);

                    const thState = document.createElement('th');
                    thState.textContent = 'State';
                    headRow.appendChild(thState);

                    const thPreview = document.createElement('th');
                    thPreview.textContent = 'Preview';
                    headRow.appendChild(thPreview);

                    if (this.options.showCode) {
                        const thCode = document.createElement('th');
                        thCode.textContent = 'Code';
                        headRow.appendChild(thCode);
                    }

                    thead.appendChild(headRow);
                    table.appendChild(thead);

                    const tbody = document.createElement('tbody');

                    categoryComponents.forEach(component => {
                        component.states.forEach(state => {
                            const row = document.createElement('tr');

                            const tdComponent = document.createElement('td');
                            tdComponent.textContent = component.name;
                            row.appendChild(tdComponent);

                            const tdState = document.createElement('td');
                            tdState.textContent = this.options.showStates !== false ? state.label : '';
                            row.appendChild(tdState);

                            const tdPreview = document.createElement('td');
                            const demo = document.createElement('div');
                            demo.className = 'component-preview__cell-demo';
                            const componentHTML = component.template(state);
                            demo.innerHTML = componentHTML;
                            tdPreview.appendChild(demo);
                            row.appendChild(tdPreview);

                            if (this.options.showCode) {
                                const tdCode = document.createElement('td');
                                const code = document.createElement('pre');
                                code.className = 'component-preview__cell-code';
                                code.textContent = componentHTML;
                                tdCode.appendChild(code);
                                row.appendChild(tdCode);
                            }

                            tbody.appendChild(row);
                        });
                    });

                    table.appendChild(tbody);
                    wrapper.appendChild(table);
                    return wrapper;
                },

                switchTheme(themeName) {
                    this.currentTheme = themeName;
                    document.body.setAttribute('data-theme', themeName);

                    const select = container.querySelector('.component-preview__theme-select');
                    if (select) {
                        select.value = themeName;
                    }

                    if (this.options.onThemeChange) {
                        this.options.onThemeChange(themeName);
                    }
                },

                updateOptions(newOptions) {
                    this.options = { ...this.options, ...newOptions };
                    this.render();
                }
            };

            preview.render();
            return preview;
        }

        // Initialize the component preview
        function initializePreview() {
            const container = document.getElementById('component-preview-container');

            componentPreview = createComponentPreview(container, mockComponents, mockThemes, {
                showStates: showStates,
                showCode: showCode,
                compactMode: compactMode,
                onThemeChange: (theme) => {
                    console.log('Theme changed to:', theme);
                }
            });
        }

        // Control functions
        window.toggleStates = function () {
            showStates = !showStates;
            const button = event.target;
            button.classList.toggle('active', showStates);
            if (componentPreview) {
                componentPreview.updateOptions({ showStates });
            }
        };

        window.toggleCode = function () {
            showCode = !showCode;
            const button = event.target;
            button.classList.toggle('active', showCode);
            if (componentPreview) {
                componentPreview.updateOptions({ showCode });
            }
        };

        window.toggleCompact = function () {
            compactMode = !compactMode;
            const button = event.target;
            button.classList.toggle('active', compactMode);
            if (componentPreview) {
                componentPreview.updateOptions({ compactMode });
            }
        };

        window.refreshPreview = function () {
            initializePreview();
        };

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            initializePreview();
            // Settings toggle wiring
            const panel = document.getElementById('plugin-settings-panel');
            const toggleBtn = document.getElementById('plugin-settings-toggle');
            const closeBtn = document.getElementById('plugin-settings-close');
            function setSettingsVisible(visible) {
                if (!panel) return;
                panel.style.display = visible ? 'block' : 'none';
                panel.setAttribute('aria-hidden', visible ? 'false' : 'true');
            }
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => setSettingsVisible(panel && panel.style.display !== 'block'));
            }
            if (closeBtn) {
                closeBtn.addEventListener('click', () => setSettingsVisible(false));
            }

            // Theme sync from settings mock
            const themeRadios = document.querySelectorAll('input[name="demo-theme"]');
            themeRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    const value = e.target.value;
                    if (!componentPreview) return;
                    // Map 'system' to boilerplate for demo
                    const themeName = value === 'system' ? 'boilerplate' : value;
                    componentPreview.switchTheme(themeName);
                });
            });
        });
    </script>
</body>
