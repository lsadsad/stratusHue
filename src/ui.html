<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stratus Hue Plugin</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="scrollable-content">
    <nav id="quick-actions" role="toolbar" aria-label="Quick actions">
      <ul class="action-list">
        <li>
          <button id="back-btn" class="action-btn" aria-label="Go back" disabled>
            <i class="icon" aria-hidden="true">←</i>
            <span class="label">Back</span>
          </button>
        </li>
        <li>
          <button id="forward-btn" class="action-btn" aria-label="Go forward" disabled>
            <i class="icon" aria-hidden="true">→</i>
            <span class="label">Forward</span>
          </button>
        </li>
      </ul>
    </nav>

    <header id="tags-header" class="section-header collapsible" data-target="color-section" role="button" tabindex="0"
      aria-expanded="true" aria-controls="color-section">
      <div class="header-left">
        <div class="icon-container">
          <i class="arrow" aria-hidden="true">-</i>
          <i class="tag-icon">🏷️</i>
        </div>
        <h2 class="header-title">TAGS
          <small class="header-subtitle"> /
            <span id="emoji-set-indicator" class="emoji-set-title">
              <span class="set-name">Colors</span>
            </span>
          </small>
        </h2>
      </div>
      <nav class="header-right">
        <ul class="emoji-nav-list">
          <li>
            <button id="emoji-nav-left" class="emoji-nav-btn" aria-label="Previous emoji set">
              <i class="nav-arrow">←</i>
            </button>
          </li>
          <li>
            <button id="emoji-nav-right" class="emoji-nav-btn" aria-label="Next emoji set">
              <i class="nav-arrow">→</i>
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <section id="color-section" class="collapsible-content" role="region" aria-labelledby="tags-header">
      <div class="color-grid-container">
        <div class="tags-status-bar">
          <p id="status-indicator" class="top-badge" aria-live="polite">onPage</p>
          <button id="deselect-btn" class="action-btn" aria-label="Deselect layers">
            <i class="icon" aria-hidden="true">✕</i>
            <span class="label">Deselect</span>
          </button>
        </div>
        <div id="color-emoji-buttons" class="color-grid" role="group" aria-label="Color tags"></div>
        <button id="clear-color" class="clear-action" aria-label="Clear color tags">
          <span class="action-bracket">[ [</span>
          <span class="action-text">Remove 🏷️</span>
          <span class="action-bracket">] ]</span>
        </button>
      </div>
    </section>

    <header id="anchors-header" class="section-header collapsible" data-target="anchors-section" role="button"
      tabindex="0" aria-expanded="true" aria-controls="anchors-section">
      <div class="header-left">
        <i class="arrow" aria-hidden="true">-</i>
        <h2>Anchors</h2>
      </div>
      <div class="header-right">
        <button id="refresh-anchors" class="action-btn" aria-label="Refresh anchors">
          <i class="icon" aria-hidden="true">⟳</i>
        </button>
        <p id="bookmark-count" class="top-badge" aria-live="polite">0</p>
      </div>
    </header>

    <section id="anchors-section" class="collapsible-content" role="region" aria-labelledby="anchors-header">
      <div class="anchors-container">
        <ul id="bookmark-list" role="list" aria-label="Bookmarks"></ul>
        <button id="save-bookmark" aria-label="Save bookmark">
          <span class="action-bracket">[ [</span>
          <span class="action-text">Drop ⚓️</span>
          <span class="action-bracket">] ]</span>
        </button>
      </div>
    </section>
  </main>

  <div id="tooltip" class="tooltip"></div>

  <footer id="footer">
    <ul class="footer-controls">
      <li>
        <button id="footer-width-toggle" class="footer-icon-btn" aria-label="Toggle width" title="Width">↔</button>
      </li>
      <li>
        <div id="footer-resize" role="separator" aria-orientation="vertical" aria-label="Resize panel" tabindex="0">
          <i class="grip">: : :</i>
        </div>
      </li>
      <li>
        <button id="footer-fit" class="footer-icon-btn" aria-label="Fit" title="Fit">↕</button>
      </li>
    </ul>
  </footer>

</body>

</html>
