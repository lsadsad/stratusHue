<div class="scrollable-content">
  <!-- Quick Actions Section -->
  <div id="quick-actions" role="toolbar" aria-label="Quick actions">
    <button id="back-btn" class="action-btn" aria-label="Go back" disabled>
      <span class="icon" aria-hidden="true">←</span>
      <span class="label">Back</span>
    </button>
    <button id="forward-btn" class="action-btn" aria-label="Go forward" disabled>
      <span class="icon" aria-hidden="true">→</span>
      <span class="label">Forward</span>
    </button>
  </div>

  <!-- Color Tags Section -->
  <h2 id="tags-header" class="section-header collapsible" data-target="color-section" role="button" tabindex="0"
    aria-expanded="true" aria-controls="color-section">
    <div class="header-left">
      <span class="arrow" aria-hidden="true">-</span>
      <span>Tags</span>
    </div>
    <div class="header-right">
      <span id="status-indicator" class="top-badge" aria-live="polite">onPage</span>
      <button id="deselect-btn" class="action-btn" aria-label="Deselect layers">
        <span class="icon" aria-hidden="true">✕</span>
        <span class="label">Deselect</span>
      </button>
    </div>
  </h2>
  <div id="color-section" class="collapsible-content" role="region" aria-labelledby="tags-header">
    <div class="color-grid-container">
      <!-- Emoji Navigation - Full Width -->
      <div class="emoji-nav-group">
        <button id="emoji-nav-left" class="emoji-nav-btn" aria-label="Previous emoji set">
          <span class="nav-arrow">←</span>
        </button>
        <span id="emoji-set-indicator" class="emoji-set-title">↳ <span class="set-bracket">{ </span><span
            class="set-name">Colors</span><span class="set-bracket"> }</span></span>
        <button id="emoji-nav-right" class="emoji-nav-btn" aria-label="Next emoji set">
          <span class="nav-arrow">→</span>
        </button>
      </div>
      <div id="color-emoji-buttons" class="color-grid" role="group" aria-label="Color tags"></div>
      <button id="clear-color" class="clear-action" aria-label="Clear color tags">
        <span class="action-bracket">[ [</span>
        <span class="action-text">Remove 🏷️</span>
        <span class="action-bracket">] ]</span>
      </button>
    </div>
  </div>

  <!-- Anchors Section -->
  <h2 id="anchors-header" class="section-header collapsible" data-target="anchors-section" role="button" tabindex="0"
    aria-expanded="true" aria-controls="anchors-section">
    <div class="header-left">
      <span class="arrow" aria-hidden="true">-</span>
      <span>Anchors</span>
    </div>
    <div class="header-right">
      <button id="refresh-anchors" class="action-btn" aria-label="Refresh anchors"><span class="icon" aria-hidden="true">⟳</span></button>
      <span id="bookmark-count" class="top-badge" aria-live="polite">0</span>
    </div>
  </h2>
  <div id="anchors-section" class="collapsible-content" role="region" aria-labelledby="anchors-header">
    <div class="anchors-container">
      <ul id="bookmark-list" role="list" aria-label="Bookmarks"></ul>
      <button id="save-bookmark" aria-label="Save bookmark">
        <span class="action-bracket">[ [</span>
        <span class="action-text">Drop ⚓️</span>
        <span class="action-bracket">] ]</span>
      </button>

    </div>
  </div>

</div>

<style>
  /* Use system fonts instead of external Google Fonts to avoid CSP issues */
  /* Inter font will be available on most systems, with fallbacks */

  /* CSS Custom Properties for Responsive Design */
  /* 
    RESPONSIVE DESIGN SYSTEM
    ========================
    Easily adjust the entire UI by modifying these CSS variables:
    
    Spacing: --spacing-xs (2px) to --spacing-xxl (12px)
    Buttons: --button-height-sm (16px) to --button-height-lg (32px)  
    Icons: --icon-size-sm (8px) to --icon-size-xl (18px)
    Layout: --footer-height, --container-padding, --section-padding
    Borders: --border-radius-sm (3px) to --border-radius-xl (8px)
    Grids: --nav-grid-cols, --tags-grid-cols, --tags-actions-cols
    
    Example: Change --spacing-lg from 8px to 12px to increase all container padding
  */
  :root {
    /* Spacing System */
    --spacing-xs: 2px;
    --spacing-sm: 4px;
    --spacing-md: 6px;
    --spacing-lg: 8px;
    --spacing-xl: 10px;
    --spacing-xxl: 12px;

    /* Component Sizes */
    --button-height-sm: 16px;
    --button-height-md: 28px;
    --button-height-lg: 32px;
    --icon-size-sm: 8px;
    --icon-size-md: 12px;
    --icon-size-lg: 16px;
    --icon-size-xl: 18px;

    /* Layout Dimensions */
    --footer-height: 20px;
    --section-padding: var(--spacing-lg);
    --container-padding: var(--spacing-lg);
    --border-radius-sm: 3px;
    --border-radius-md: 4px;
    --border-radius-lg: 6px;
    --border-radius-xl: 8px;

    /* Content Constraints */
    --max-content-height: 300px;
    --badge-size: 14px;
    --arrow-width: 10px;
    --scrollbar-width: 2px;

    /* Grid Systems */
    --tags-grid-cols: repeat(4, 1fr);
    --tags-actions-cols: repeat(4, 1fr);

    /* Responsive Breakpoints */
    --min-button-width: 40px;
    --max-section-width: 100%;

    /* Adaptive Sizing */
    --container-min-width: 188px;
    --container-max-width: 188px;

    /* Minimum Height Calculation */
    /* Quick Actions: 6px (top padding) + 28px (button height) + 6px (gap) = 40px */
    /* Section Header: 10px (top padding) + 8px (font-size/line-height) + 10px (bottom padding) + 2px (borders) = 30px each */
    /* Three Headers: 30px × 3 = 90px */
    /* Footer: 20px */
    /* Total Minimum: 40px + 90px + 20px = 150px */
    --min-plugin-height: 150px;
  }

  /* Fixed width - no responsive adjustments needed */

  /* Base styles remain the same */
  html,
  body {
    width: 188px;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    box-sizing: border-box;
  }

  body {
    width: 188px;
    height: 100%;
    min-height: var(--min-plugin-height);
    overflow: hidden;
    background: #0f0f0f;
    display: flex;
    flex-direction: column;
    position: relative;
    padding-bottom: var(--footer-height);
    /* Account for fixed footer */
    box-sizing: border-box;
  }

  body,
  button,
  h3 {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segue UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 500;
    font-size: 12px;
  }

  /* Scrollbar styles */
  .scrollable-content {
    width: 188px;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-gutter: stable;
  }

  .scrollable-content {
    padding-bottom: var(--footer-height);
    /* Ensure content doesn't hide behind footer */
  }

  .scrollable-content::-webkit-scrollbar {
    width: var(--scrollbar-width);
  }

  .scrollable-content::-webkit-scrollbar-track {
    background: #0f0f0f;
    border-radius: 2px;
  }

  .scrollable-content::-webkit-scrollbar-thumb {
    background: #404040;
    border-radius: 2px;
    transition: background 0.2s ease;
  }

  .scrollable-content::-webkit-scrollbar-thumb:hover {
    background: #505050;
  }

  /* Quick Actions Section */
  #quick-actions {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: var(--spacing-md);
    padding: var(--spacing-md) var(--spacing-lg) 0 var(--spacing-lg);
    flex-wrap: nowrap;
    overflow: hidden;
  }

  .qa-spacer {
    flex: 1 1 auto;
  }

  .top-badge {
    background: #2a2a2a;
    padding: 0 var(--spacing-md);
    border-radius: var(--spacing-xl);
    font-size: var(--icon-size-sm);
    font-weight: 500;
    color: #f5f5f5;
    line-height: var(--button-height-sm);
    height: var(--button-height-sm);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .action-btn {
    width: var(--button-height-md);
    height: var(--button-height-md);
    font-size: var(--icon-size-sm);
    border-radius: var(--border-radius-md);
    border: none;
    background: #1a1a1a;
    color: #f5f5f5;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 0;
    position: relative;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    flex: 0 0 auto;
  }

  .action-btn .icon {
    font-size: var(--icon-size-lg);
    opacity: 0.8;
  }

  .action-btn .label {
    display: none;
    /* Hide names in the bar; shown via tooltip on hover */
  }

  .action-btn:hover {
    background: #2a2a2a;
    transform: translateY(-1px);
  }

  .action-btn:active {
    background: rgba(255, 105, 180, 0.4);
    transform: translateY(0);
  }

  /* Subtle accent colors for specific action buttons */


  #new-page-btn:hover {
    background: rgba(255, 107, 107, 0.15);
    /* subtle red accent */
  }

  #deselect-btn:hover {
    background: rgba(110, 222, 110, 0.15);
    /* subtle green accent */
  }

  #back-btn:hover {
    background: rgba(255, 193, 7, 0.15);
    /* subtle yellow accent */
  }

  #forward-btn:hover {
    background: rgba(255, 193, 7, 0.15);
    /* subtle yellow accent */
  }

  .action-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    background: #1a1a1a;
  }

  .action-btn:disabled:hover {
    background: #1a1a1a;
    transform: none;
  }




  /* Color Section */
  .color-grid-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: #0a0a0a;
    padding: var(--container-padding) calc(var(--container-padding) + 8px) var(--container-padding);
    border-radius: var(--border-radius-md);
  }



  .tags-btn {
    width: 100%;
    min-width: var(--min-button-width);
    padding: var(--spacing-lg) var(--spacing-xxl);
    font-size: var(--spacing-xl);
    border-radius: var(--border-radius-xl);
    border: none;
    background: #1a1a1a;
    color: #f5f5f5;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s ease;
    text-align: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: var(--button-height-lg);
  }

  /* Make Date button lighter weight */
  #add-date-btn {
    font-weight: 200;
    /* Decrease top/bottom by 8px from base (8px -> 0px) */
    padding: 0 var(--spacing-xxl);
  }

  /* Emoji navigation group - Markdown-like styling */
  .emoji-nav-group {
    display: flex;
    align-items: center;
    gap: 0;
    background: transparent;
    border-radius: 0;
    padding: var(--spacing-sm) 64px var(--spacing-sm) 0;
    width: 100%;
    position: relative;
    min-height: 32px;
    box-sizing: border-box;
  }

  .emoji-set-title {
    flex: 1;
    font-size: var(--icon-size-sm);
    font-weight: 300;
    color: rgba(255, 255, 255, 0.9);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: left;
    margin: 0;
    padding: 0 0 0 8px;
  }

  .set-bracket {
    font-size: var(--icon-size-sm);
    font-weight: 100;
    opacity: 0.6;
    transition: all 0.2s ease;
  }

  .set-name {
    font-weight: inherit;
  }

  .emoji-nav-btn {
    position: absolute;
    width: 32px;
    height: 32px;
    padding: 0;
    font-size: var(--icon-size-md);
    border-radius: var(--border-radius-sm);
    border: none;
    background: transparent;
    color: rgba(255, 255, 255, 0.8);
    cursor: pointer;
    font-weight: 100;
    transition: all 0.2s ease;
    text-align: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    top: 50%;
    transform: translateY(-50%);
    box-sizing: border-box;
  }

  .nav-arrow {
    font-size: var(--icon-size-md);
    font-weight: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #emoji-nav-left {
    right: 32px;
  }

  #emoji-nav-right {
    right: 0;
  }

  .emoji-nav-btn:hover:not(:disabled) {
    background: rgba(42, 42, 42, 0.2);
    color: rgba(255, 255, 255, 0.9);
    font-weight: 600;
    transform: translateY(-50%) scale(1.05);
  }

  .emoji-nav-btn:active:not(:disabled) {
    background: rgba(64, 64, 64, 0.2);
    color: #f5f5f5;
    font-weight: 900;
    transform: translateY(-50%) scale(0.95);
  }

  .emoji-nav-btn:disabled {
    opacity: 0.1;
    cursor: not-allowed;
    background: transparent;
  }



  .tags-btn:hover {
    background: #2a2a2a;
  }

  .tags-btn:active {
    background: #404040;
  }

  /* Disabled state for tags-style buttons (e.g., Collapse Folders) */
  .tags-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    background: #0f0f0f;
  }

  .tags-btn:disabled:hover {
    background: #0f0f0f;
  }

  .color-grid {
    display: grid;
    grid-template-columns: var(--tags-grid-cols);
    grid-gap: var(--spacing-xs);
    width: 100%;
  }

  #color-emoji-buttons {
    opacity: 0.8;
  }

  .emoji-button {
    font-size: var(--icon-size-xl);
    width: 100%;
    height: var(--button-height-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: var(--border-radius-xl);
    border: none;
    background: transparent;
    color: #f5f5f5;
    transition: all 0.2s ease;
  }

  .emoji-button:hover {
    background: #2a2a2a;
    transform: scale(1.1);
  }

  .emoji-button:active {
    background: #404040;
    transform: scale(0.95);
  }

  .clear-action {
    width: 100%;
    padding: 0 16px;
    font-size: var(--spacing-xl);
    border-radius: var(--border-radius-xl);
    border: none;
    background: transparent;
    color: rgba(255, 255, 255, 0.8);
    cursor: pointer;
    font-weight: 100;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    opacity: 1;
    height: var(--button-height-lg);
    box-sizing: border-box;
  }

  .clear-action .icon {
    font-size: 8px;
    opacity: 0.7;
  }

  .clear-action:hover {
    background: rgba(42, 42, 42, 0.2);
    font-weight: 600;
    transform: scale(1.05);
  }

  .clear-action:active {
    background: rgba(64, 64, 64, 0.2);
    font-weight: 800;
    transform: scale(0.95);
  }

  /* Section Headers */
  .section-header {
    font-size: var(--icon-size-sm);
    /* match badge size */
    margin: 0 0 0 0;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f0f0f;
    border-radius: 0;
    padding: var(--spacing-xl) var(--spacing-xxl);
    position: relative;
    text-transform: uppercase;
    /* IDE style headings */
    letter-spacing: 0.16em;
    /* approx. 10% tracking */
  }

  .section-header:first-of-type {
    margin-top: 0;
  }

  .section-header:hover {
    background: #1a1a1a;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: var(--spacing-md);
    margin-left: auto;
  }

  .section-badge {
    background: transparent;
    border: none;
    padding: 0;
    font-size: var(--icon-size-md);
    font-weight: inherit;
    /* match heading weight */
    white-space: nowrap;
    text-transform: none;
    letter-spacing: normal;
    display: inline-flex;
    /* for vertical centering */
    align-items: center;
    justify-content: center;
    width: var(--badge-size);
    /* fixed box for optical centering */
    height: var(--badge-size);
    /* fixed box for optical centering */
    line-height: var(--badge-size);
    /* keeps glyph centered */
    vertical-align: middle;
    position: absolute;
    top: var(--spacing-sm);
    right: var(--spacing-sm);
  }

  #tags-badge,
  #anchors-badge {
    color: #f5f5f5;
  }

  /* Action buttons in headers should be smaller */
  .header-right .action-btn {
    width: 24px;
    height: 24px;
    font-size: var(--icon-size-sm);
  }

  .header-right .action-btn .icon {
    font-size: var(--icon-size-md);
  }

  /* Status indicator should maintain its original styling */
  .header-right .top-badge {
    text-transform: none;
    letter-spacing: normal;
  }

  .arrow {
    font-size: var(--icon-size-md);
    font-weight: 900;
    /* make +/- max weight */
    color: #f5f5f5;
    width: var(--arrow-width);
  }

  /* Color +/- based on expanded state (IDE-like) */
  .section-header[aria-expanded="true"] .arrow {
    /* expanded shows '-' */
    color: #f5f5f5;
    font-weight: 300;
    /* match lighter heading when expanded */
  }

  .section-header[aria-expanded="false"] .arrow {
    /* collapsed shows '+' */
    color: #f5f5f5;
    font-weight: 800;
    /* match boldest heading when collapsed */
  }

  /* Adjust heading weight by expanded/collapsed state */
  /* Ensure all headings (e.g., - NAV... onPage) use the same weights */
  .section-header[aria-expanded="true"] {
    /* expanded */
    font-weight: 300;
    /* lighter */
  }

  .section-header[aria-expanded="false"] {
    /* collapsed */
    font-weight: 800;
    /* boldest when collapsed */
  }





  .collapsible-content {
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.3s ease;
    max-height: var(--max-content-height);
    opacity: 1;
  }

  .collapsible-content.collapsed {
    max-height: 0;
    opacity: 0;
    margin-bottom: 0;
    /* Remove any bottom margin when collapsed */
  }



  /* Anchors Section */
  #anchors-section {
    display: flex;
    flex-direction: column;
    overflow: visible;
    /* Let parent handle scrolling */
    background: #0a0a0a;
    padding: 0px;
    border-radius: 4px;
  }

  /* Only expand anchors section when not collapsed */
  #anchors-section:not(.collapsed) {
    flex: 0 0 auto;
    /* Don't grow, just fit content */
  }

  .anchors-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--spacing-lg);
    background: #0a0a0a;
    padding: var(--container-padding);
    border-radius: var(--border-radius-md);
  }

  #bookmark-list {
    flex: 0 0 auto;
    /* Don't grow, fit content */
    overflow-y: visible;
    /* No internal scrolling, let the main container handle it */
    list-style: none;
    padding: 0;
    margin: 0;
    width: 100%;
  }

  .bookmark-item {
    display: flex;
    align-items: center;
    margin-bottom: 0;
    font-size: var(--spacing-xl);
    background: transparent;
    border-radius: 0;
    padding: var(--spacing-lg);
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid transparent;
    position: relative;
    overflow: hidden;
  }

  .bookmark-item:hover {
    background: #1a1a1a;
    border-radius: var(--border-radius-sm);
  }

  .bookmark-item:active {
    background: #2a2a2a;

  function setupPricingModalEvents() {
    document.getElementById('close-pricing-modal')?.addEventListener('click', closePricingModal);
    
    // Click outside to close
    document.getElementById('pricing-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'pricing-modal') closePricingModal();
    });
  }

  function showPricingModal(data) {
    const modal = document.getElementById('pricing-modal');
    const titleEl = document.getElementById('pricing-modal-title');
    const messageEl = document.getElementById('pricing-message');
    const tiersEl = document.getElementById('pricing-tiers');
    
    if (titleEl) titleEl.textContent = getPricingModalTitle(data.model);
    if (messageEl) messageEl.textContent = data.message;
    
    if (tiersEl) {
      tiersEl.innerHTML = '';
      data.upgradeOptions.forEach(option => {
        const tierEl = createPricingTierElement(option, data.model);
        tiersEl.appendChild(tierEl);
      });
    }
    
    if (modal) modal.classList.remove('hidden');
  }

  function closePricingModal() {
    const modal = document.getElementById('pricing-modal');
    if (modal) modal.classList.add('hidden');
  }

  function getPricingModalTitle(model) {
    const titles = {
      'freemium': 'Upgrade to Premium',
      'one-time': 'Get Lifetime Access',
      'subscription': 'Choose Your Plan',
      'tiered': 'Upgrade Your Tier',
      'usage-based': 'Buy More Credits'
    };
    return titles[model] || 'Choose Your Plan';
  }

  function createPricingTierElement(option, model) {
    const tierEl = document.createElement('div');
    tierEl.className = `pricing-tier ${option.popular ? 'popular' : ''}`;
    
    let featuresHtml = '';
    if (option.features) {
      featuresHtml = `
        <ul class="tier-features">
          ${option.features.map(feature => `<li>${formatFeatureName(feature)}</li>`).join('')}
        </ul>
      `;
    }

    let limitsHtml = '';
    if (option.limits) {
      limitsHtml = `
        <div class="tier-limits">
          <h5>What you get:</h5>
          <ul>
            <li>Bookmarks: ${option.limits.maxBookmarks === -1 ? 'Unlimited' : option.limits.maxBookmarks}</li>
            <li>Emoji Sets: ${option.limits.maxEmojiSets === -1 ? 'All' : option.limits.maxEmojiSets}</li>
            <li>History: ${option.limits.maxHistoryEntries === -1 ? 'Unlimited' : option.limits.maxHistoryEntries}</li>
          </ul>
        </div>
      `;
    }

    let creditsHtml = '';
    if (model === 'usage-based' && option.credits) {
      creditsHtml = `
        <div class="credits-display">
          <div class="credits-count">${option.credits}</div>
          <div class="credits-label">Credits</div>
        </div>
      `;
    }

    tierEl.innerHTML = `
      <div class="tier-header">
        <div class="tier-name">${option.name}</div>
        <div class="tier-price-container">
          <div class="tier-price">${option.price}</div>
          ${option.savings ? `<div class="tier-savings">${option.savings}</div>` : ''}
        </div>
      </div>
      ${creditsHtml}
      ${limitsHtml}
      ${featuresHtml}
      <button class="tier-select-btn" onclick="selectPricingTier('${option.variantId || option.name}')">
        ${model === 'usage-based' ? 'Buy Credits' : 'Select Plan'}
      </button>
    `;
    
    return tierEl;
  }

  function formatFeatureName(feature) {
    const names = {
      'unlimited_bookmarks': 'Unlimited bookmarks',
      'all_emoji_sets': 'All emoji sets',
      'export_bookmarks': 'Export bookmarks',
      'team_sharing': 'Team sharing',
      'advanced_navigation': 'Advanced navigation',
      'priority_support': 'Priority support',
      'all_features': 'All premium features',
      'lifetime_updates': 'Lifetime updates',
      'pay_per_bookmark': 'Pay per bookmark',
      'pay_per_export': 'Pay per export',
      'bulk_operations': 'Bulk operations'
    };
    return names[feature] || feature.replace(/_/g, ' ');
  }

  function selectPricingTier(variantId) {
    sendMessage('select-pricing-tier', { variantId });
    closePricingModal();
  }

    // Footer fit-to-content
    document.getElementById('footer-fit')?.addEventListener('click', () => {
      try {
        const scrollable = document.querySelector('.scrollable-content');
        if (!scrollable) return;

        function computeVisibleContentBottomPx() {
          let totalHeight = 0;

          // Measure plugin header
          const pluginHeader = document.getElementById('plugin-header');
          if (pluginHeader) {
            totalHeight += pluginHeader.offsetHeight;
          }

          // Measure quick actions
          const quickActions = document.getElementById('quick-actions');
          if (quickActions) {
            totalHeight += quickActions.offsetHeight;
          }

          // Measure tags section
          const tagsHeader = document.querySelector('#tags-header');
          const tagsContent = document.querySelector('#color-section');
          if (tagsHeader) {
            totalHeight += tagsHeader.offsetHeight;
          }
          if (tagsContent && !tagsContent.classList.contains('collapsed')) {
            totalHeight += tagsContent.offsetHeight;
          }

          // Measure anchors section header
          const anchorsHeader = document.querySelector('#anchors-header');
          if (anchorsHeader) {
            totalHeight += anchorsHeader.offsetHeight;
          }

          // For anchors section, measure the actual content instead of the flexible container
          const anchorsSection = document.querySelector('#anchors-section');
          if (anchorsSection && !anchorsSection.classList.contains('collapsed')) {
            // Measure the anchors container padding and buttons
            const anchorsContainer = document.querySelector('.anchors-container');
            if (anchorsContainer) {
              const containerStyle = window.getComputedStyle(anchorsContainer);
              const containerPadding = parseInt(containerStyle.paddingTop) + parseInt(containerStyle.paddingBottom);
              totalHeight += containerPadding;

              // Measure bookmark list content
              const bookmarkList = document.querySelector('#bookmark-list');
              if (bookmarkList) {
                const bookmarkItems = bookmarkList.querySelectorAll('.bookmark-item');
                bookmarkItems.forEach(item => {
                  totalHeight += item.offsetHeight;
                });
              }

              // Measure action buttons
              const saveBookmark = document.querySelector('#save-bookmark');
              if (saveBookmark) totalHeight += saveBookmark.offsetHeight;

              // Add gap spacing between elements (1 gap for 2 elements)
              totalHeight += 8; // 1 * 8px gap
            }
          }

          // Add footer height (it's positioned absolutely so not included in normal flow)
          const footer = document.getElementById('footer');
          if (footer) {
            totalHeight += footer.offsetHeight;
          }

          // Add some padding for margins and spacing
          totalHeight += 20;

          console.log('Content measurement:', {
            totalHeight,
            currentWindowHeight: window.innerHeight,
            pluginHeaderHeight: pluginHeader?.offsetHeight,
            quickActionsHeight: quickActions?.offsetHeight,
            tagsHeaderHeight: tagsHeader?.offsetHeight,
            tagsContentHeight: tagsContent?.offsetHeight,
            anchorsHeaderHeight: anchorsHeader?.offsetHeight,
            footerHeight: footer?.offsetHeight
          });

          return Math.ceil(totalHeight);
        }

        const minHeight = 200; // minimum plugin height (aligned with backend)
        const maxHeight = 720; // maximum plugin height
        const contentHeight = computeVisibleContentBottomPx();
        const clamped = Math.max(minHeight, Math.min(maxHeight, contentHeight));

        console.log('Fit content calculation:', {
          contentHeight,
          clamped,
          currentHeight: window.innerHeight
        });

        sendMessage('resize-ui', { width: 188, height: clamped });
      } catch (_) {
        // no-op
      }
    });

    // Collapsibles
    document.querySelectorAll('.collapsible').forEach(header => {
      header.addEventListener('click', () => toggleCollapsible(header));
    });

    // Add click handler to detect and recover from collapsed state
    document.body.addEventListener('click', (e) => {
      // Don't run recovery if user clicked on a collapsible header (let the toggle work naturally)
      if (e.target && e.target.closest('.collapsible')) {
        return;
      }
      // Don't run recovery if user clicked on any interactive element or content area
      if (e.target && (
        e.target.closest('button') ||
        e.target.closest('.action-btn') ||
        e.target.closest('.emoji-button') ||
        e.target.closest('.bookmark-item') ||
        e.target.closest('.color-grid-container') ||
        e.target.closest('.anchors-container') ||
        e.target.closest('.scrollable-content') ||
        e.target.closest('#footer')
      )) {
        return;
      }
      // Only recover if user clicks in empty space and plugin is very narrow (likely collapsed accidentally)
      if (window.innerWidth < 160) {
        setTimeout(() => {
          checkAndRecoverFromCollapsedState();
        }, 50);
      }
    });
  }

  function checkAndRecoverFromCollapsedState() {
    try {
      // Only recover if plugin is in a problematic collapsed state (very narrow width)
      const currentWidth = window.innerWidth;

      // Only recover if width is too narrow (less than 160px) - this indicates accidental collapse
      if (currentWidth < 160) {
        console.log('Auto-recovering from collapsed state...');

        // Expand at least one section (Tags section)
        const tagsSection = document.getElementById('color-section');
        const tagsHeader = document.querySelector('[data-target="color-section"]');
        if (tagsSection && tagsHeader && tagsSection.classList.contains('collapsed')) {
          tagsSection.classList.remove('collapsed');
          const arrow = tagsHeader.querySelector('.arrow');
          if (arrow) {
            arrow.textContent = '-';
            tagsHeader.setAttribute('aria-expanded', 'true');
          }
        }

        // Ensure proper width
        sendMessage('resize-ui', { width: 188, height: Math.max(352, window.innerHeight) });
      }
    } catch (error) {
      console.log('Error in auto-recovery:', error);
    }
  }

  function setupResizeHandle() {
    const handle = document.getElementById('footer-resize');
    if (!handle) return;

    let isDragging = false;
    let startY = 0;
    let startHeight = 0;

    const minHeight = 150; // align with collapsed sections height
    const maxHeight = 720; // reasonable cap for plugin modal

    function onPointerDown(e) {
      isDragging = true;
      startY = e.clientY;
      // Use current container height (viewport height of plugin UI)
      startHeight = window.innerHeight;
      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', onPointerUp, { once: true });
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const delta = e.clientY - startY;
      let next = Math.max(minHeight, Math.min(maxHeight, startHeight + delta));
      // Send resize request to host (width fixed at 188)
      sendMessage('resize-ui', { width: 188, height: Math.round(next) });
    }

    function onPointerUp() {
      isDragging = false;
      document.removeEventListener('pointermove', onPointerMove);
    }

    handle.addEventListener('pointerdown', onPointerDown);

    // Keyboard accessible resizing (Up/Down arrows)
    handle.addEventListener('keydown', (e) => {
      const step = (e.shiftKey ? 40 : 20);
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        const delta = e.key === 'ArrowUp' ? -step : step;
        const next = Math.max(150, Math.min(maxHeight, window.innerHeight + delta)); // use collapsed sections height
        sendMessage('resize-ui', { width: 188, height: Math.round(next) });
        e.preventDefault();
      }
    });
  }

  // Removed layer collapse logic from quick action; see handleCollapseSections

  function handleAddDate() {
    sendMessage('add-date-smart');
  }



  function showTooltip(text, element) {
    if (!tooltip) return;

    const rect = element.getBoundingClientRect();
    tooltip.textContent = text;
    // Center horizontally under the button
    const tooltipWidth = tooltip.offsetWidth || 0;
    const left = rect.left + Math.max(0, (rect.width - tooltipWidth) / 2);
    tooltip.style.left = left + 'px';
    tooltip.style.top = (rect.bottom + 6) + 'px';
    tooltip.classList.add('visible');
  }

  function scheduleTooltip(text, element) {
    cancelTooltip();
    hoverTimer = setTimeout(() => {
      showTooltip(text, element);
    }, 200);
  }

  function cancelTooltip() {
    if (hoverTimer) {
      clearTimeout(hoverTimer);
      hoverTimer = null;
    }
    if (tooltip) {
      tooltip.classList.remove('visible');
    }
  }



  function renderEmojiButtons(emojis) {
    const container = document.getElementById('color-emoji-buttons');
    if (!container) return;

    container.innerHTML = '';

    // Render emoji buttons
    emojis.forEach(emoji => {
      const button = document.createElement('button');
      button.className = 'emoji-button';
      button.textContent = emoji;

      // Special handling for date button
      if (emoji === '📅') {
        button.id = 'add-date-btn';
        button.setAttribute('aria-label', 'Add date');
        button.addEventListener('click', handleAddDate);
      } else if (emoji === '⚪') {
        // Generic placeholder emoji - no functionality
        button.setAttribute('aria-label', 'Date placeholder');
        button.style.opacity = '0.3';
        button.style.cursor = 'default';
        // No click handler for placeholders
      } else {
        button.addEventListener('click', () => sendMessage('add-emoji', { emoji }));
      }

      container.appendChild(button);
    });
  }

  function updateSelectionIndicator(hasSelection) {
    const tagsBadge = document.getElementById('tags-badge');
    const anchorsBadge = document.getElementById('anchors-badge');
    const deselectBtn = document.getElementById('deselect-btn');
    const statusIndicator = document.getElementById('status-indicator');

    if (tagsBadge) {
      tagsBadge.textContent = '';
    }

    if (anchorsBadge) {
      anchorsBadge.textContent = '';
    }

    if (deselectBtn) {
      deselectBtn.disabled = !hasSelection;
    }

    // Update status indicator
    const isLayer = hasSelection;
    const label = isLayer ? 'onLayer' : 'onPage';

    if (statusIndicator) {
      statusIndicator.textContent = label;
    }
  }

  function updateNavigationButtons(canGoBack, canGoForward) {
    const backBtn = document.getElementById('back-btn');
    const forwardBtn = document.getElementById('forward-btn');

    if (backBtn) {
      backBtn.disabled = !canGoBack;
    }

    if (forwardBtn) {
      forwardBtn.disabled = !canGoForward;
    }
  }

  function updateEmojiNavigation(currentSetIndex, totalSets, setName) {
    const leftBtn = document.getElementById('emoji-nav-left');
    const rightBtn = document.getElementById('emoji-nav-right');
    const indicator = document.getElementById('emoji-set-indicator');

    // Enable both buttons since navigation loops around
    if (leftBtn) {
      leftBtn.disabled = false;
    }

    if (rightBtn) {
      rightBtn.disabled = false;
    }

    if (indicator) {
      indicator.innerHTML = `↳ <span class="set-bracket">{ </span><span class="set-name">${setName}</span><span class="set-bracket"> }</span>`;
    }
  }

  function toggleCollapsible(header) {
    const targetId = header.getAttribute('data-target');
    const content = document.getElementById(targetId);
    const arrow = header.querySelector('.arrow');

    if (!content || !arrow) return;

    const isCollapsed = content.classList.toggle('collapsed');
    arrow.textContent = isCollapsed ? '+' : '-';

    // Update ARIA attributes
    header.setAttribute('aria-expanded', !isCollapsed);
  }

  function renderBookmarks(bookmarks, currentAnchorId = null, previousBookmarkId = null, isInsideAnchor = false) {
    const list = document.getElementById('bookmark-list');
    if (!list) return;

    // Update bookmark count
    updateBookmarkCount(bookmarks.length);

    list.innerHTML = '';
    bookmarks.forEach((bookmark) => {
      const li = document.createElement('li');
      li.className = 'bookmark-item';

      // Add recent-history class if this bookmark is the previous bookmark
      if (previousBookmarkId && bookmark.id === previousBookmarkId) {
        li.className += ' recent-history';
      }

      // Add current-anchor class if this bookmark is the current anchor (takes precedence)
      if (currentAnchorId && bookmark.id === currentAnchorId) {
        li.className += ' current-anchor';

        // Add inside-anchor class if user is inside the anchor
        if (isInsideAnchor) {
          li.className += ' inside-anchor';
        }
      }

      const pageName = bookmark.pageName || 'Unknown Page';
      const truncatedPageName = truncatePageTitle(pageName);

      li.innerHTML = `
        <div class="bookmark-content">
          <span class="bookmark-name" title="${escapeHtml(bookmark.name)}">${escapeHtml(bookmark.name)}</span>
          <span class="bookmark-page" title="${escapeHtml(pageName)}">${escapeHtml(truncatedPageName)}</span>
        </div>
        <button class="bookmark-remove" title="Remove">×</button>
      `;

      li.querySelector('.bookmark-content')?.addEventListener('click', () => {
        sendMessage('jump-to-bookmark', { id: bookmark.id });
      });

      li.querySelector('.bookmark-remove')?.addEventListener('click', (event) => {
        event.stopPropagation();
        sendMessage('remove-bookmark', { id: bookmark.id });
      });

      list.appendChild(li);
    });
  }

  // Listen for messages from plugin
  window.addEventListener('message', (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    switch (msg.type) {
      case 'bookmarks':
        renderBookmarks(msg.bookmarks, msg.currentAnchorId, msg.previousBookmarkId, msg.isInsideAnchor);
        break;

      case 'selection-state':
        hasLayerSelected = msg.hasLayerSelected;
        renderEmojiButtons(hasLayerSelected ? msg.layerEmojis : msg.pageEmojis);
        updateSelectionIndicator(hasLayerSelected);
        break;

      case 'show-tooltip':
        if (msg.elementId) {
          const element = document.getElementById(msg.elementId);
          if (element) showTooltip(msg.text, element);
        }
        break;

      case 'navigation-state':
        updateNavigationButtons(msg.canGoBack, msg.canGoForward);
        break;

      case 'emoji-navigation-state':
        updateEmojiNavigation(msg.currentSetIndex, msg.totalSets, msg.setName);
        break;

      case 'credits-updated':

      case 'tier-activated':
        updateSubscriptionStatus({ isPremium: true, isActive: true });

  });
