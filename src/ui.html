<div class="scrollable-content">
  <!-- Quick Actions Section -->
  <div id="quick-actions" role="toolbar" aria-label="Quick actions">
    <button id="back-btn" class="action-btn" aria-label="Go back" disabled>
      <span class="icon" aria-hidden="true">←</span>
      <span class="label">Back</span>
    </button>
    <button id="forward-btn" class="action-btn" aria-label="Go forward" disabled>
      <span class="icon" aria-hidden="true">→</span>
      <span class="label">Forward</span>
    </button>
  </div>

  <!-- Color Tags Section -->
  <h2 id="tags-header" class="section-header collapsible" data-target="color-section" role="button" tabindex="0"
    aria-expanded="true" aria-controls="color-section">
    <div class="header-left">
      <div class="icon-container">
      <span class="arrow" aria-hidden="true">-</span>
        <span class="tag-icon">🏷️</span>
    </div>
      <span class="header-title">TAGS<span class="header-subtitle"> / <span id="emoji-set-indicator" class="emoji-set-title"><span class="set-name">Colors</span></span></span></span>
    </div>
    <div class="header-right">
        <button id="emoji-nav-left" class="emoji-nav-btn" aria-label="Previous emoji set">
          <span class="nav-arrow">←</span>
        </button>
        <button id="emoji-nav-right" class="emoji-nav-btn" aria-label="Next emoji set">
          <span class="nav-arrow">→</span>
        </button>
      </div>
  </h2>
  <div id="color-section" class="collapsible-content" role="region" aria-labelledby="tags-header">
    <div class="color-grid-container">
      <!-- Status and Actions moved to content -->
      <div class="tags-status-bar">
        <span id="status-indicator" class="top-badge" aria-live="polite">onPage</span>
        <button id="deselect-btn" class="action-btn" aria-label="Deselect layers">
          <span class="icon" aria-hidden="true">✕</span>
          <span class="label">Deselect</span>
        </button>
      </div>

      <div id="color-emoji-buttons" class="color-grid" role="group" aria-label="Color tags"></div>
      <button id="clear-color" class="clear-action" aria-label="Clear color tags">
        <span class="action-bracket">[ [</span>
        <span class="action-text">Remove 🏷️</span>
        <span class="action-bracket">] ]</span>
      </button>
    </div>
  </div>

  <!-- Anchors Section -->
  <h2 id="anchors-header" class="section-header collapsible" data-target="anchors-section" role="button" tabindex="0"
    aria-expanded="true" aria-controls="anchors-section">
    <div class="header-left">
      <span class="arrow" aria-hidden="true">-</span>
      <span>Anchors</span>
    </div>
    <div class="header-right">
      <button id="refresh-anchors" class="action-btn" aria-label="Refresh anchors"><span class="icon" aria-hidden="true">⟳</span></button>
      <span id="bookmark-count" class="top-badge" aria-live="polite">0</span>
    </div>
  </h2>
  <div id="anchors-section" class="collapsible-content" role="region" aria-labelledby="anchors-header">
    <div class="anchors-container">
      <ul id="bookmark-list" role="list" aria-label="Bookmarks"></ul>
      <button id="save-bookmark" aria-label="Save bookmark">
        <span class="action-bracket">[ [</span>
        <span class="action-text">Drop ⚓️</span>
        <span class="action-bracket">] ]</span>
      </button>

    </div>
  </div>

</div>

<!-- Tooltip -->
<div id="tooltip" class="tooltip"></div>
<!-- Footer with width toggle (left), centered handle, and fit button (right) -->
<footer id="footer">
  <button id="footer-width-toggle" class="footer-icon-btn" aria-label="Toggle width" title="Width">↔</button>
  <div id="footer-resize" role="separator" aria-orientation="vertical" aria-label="Resize panel" tabindex="0">
    <span class="grip">: : :</span>
  </div>
  <button id="footer-fit" class="footer-icon-btn" aria-label="Fit" title="Fit">↕</button>
</footer>

<!-- External Stylesheets -->
<link rel="stylesheet" href="styles/main.css">

<script>
  // Helper function to send messages to plugin
  function sendMessage(type, data = {}) {
    parent.postMessage({ pluginMessage: { type, ...data } }, '*');
  }

  // Helper function to escape HTML
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Configuration
  const MAX_TITLE_LENGTH = 20;
  const MAX_PAGE_TITLE_LENGTH = 32;

  // Helper function to truncate page titles
  function truncatePageTitle(text, maxLength = MAX_PAGE_TITLE_LENGTH) {
    if (text.length <= maxLength) return text;
    return text.substring(0, maxLength - 1) + '…';
  }

  // State
  let hasLayerSelected = false;
  let tooltip = null;
  let hoverTimer = null;
  let subscriptionStatus = { isPremium: false, isActive: false };
  let bookmarkCount = 0;

  // Simplified bookmark count update without premium features (global scope)
  function updateBookmarkCount(count) {
    bookmarkCount = count;
    const bookmarkCountEl = document.getElementById('bookmark-count');
    if (bookmarkCountEl) {
      bookmarkCountEl.textContent = `${bookmarkCount}`;
    }
  }

  // Initialize UI when DOM is ready
  window.addEventListener('DOMContentLoaded', () => {
    tooltip = document.getElementById('tooltip');
    setupEventListeners();
    setupResizeHandle();

    // Ensure proper sizing immediately (fill container)
    document.body.style.width = '100%';
    document.documentElement.style.width = '100%';

    // Apply dark theme explicitly
    document.documentElement.setAttribute('data-theme', 'dark');

    // Send ui-ready after a small delay to ensure CSS is fully applied
    setTimeout(() => {
      sendMessage('ui-ready');
    }, 50);

    // Auto-recovery mechanism for collapsed state
    setTimeout(() => {
      checkAndRecoverFromCollapsedState();
    }, 100);

    // Request initial subscription status - TEMPORARILY DISABLED
    // sendMessage('check-subscription-status');
  });

  // Note: do not re-clamp width on window resize; let the host own width.
  // Only adjust height explicitly via messages when the user triggers it.

  function setupEventListeners() {
    // Quick Actions
    const deselectBtn = document.getElementById('deselect-btn');






    const backBtn = document.getElementById('back-btn');

    const forwardBtn = document.getElementById('forward-btn');

    deselectBtn?.addEventListener('click', (e) => {
      e.stopPropagation();
      sendMessage('deselect');
    });

    backBtn?.addEventListener('click', () => sendMessage('go-back'));
    forwardBtn?.addEventListener('click', () => sendMessage('go-forward'));

    // Tooltip setup
    const hoverTargets = [
      { el: deselectBtn, text: 'Deselect' },
      { el: backBtn, text: 'Back' },
      { el: forwardBtn, text: 'Forward' }
    ];




    hoverTargets.forEach(({ el, text }) => {
      if (!el) return;
      el.addEventListener('mouseenter', () => scheduleTooltip(text, el));
      el.addEventListener('focus', () => scheduleTooltip(text, el));
      el.addEventListener('mouseleave', cancelTooltip);
      el.addEventListener('blur', cancelTooltip);
    });

    // Escape key handling
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        cancelTooltip();
      }
    });

    // Other event listeners
    document.getElementById('clear-color')?.addEventListener('click', () => sendMessage('clear-emoji'));

    // Emoji navigation
    document.getElementById('emoji-nav-left')?.addEventListener('click', (e) => {
      e.stopPropagation();
      sendMessage('navigate-emoji-set', { direction: 'prev' });
    });
    document.getElementById('emoji-nav-right')?.addEventListener('click', (e) => {
      e.stopPropagation();
      sendMessage('navigate-emoji-set', { direction: 'next' });
    });

    // Bookmark and anchor management
    document.getElementById('save-bookmark')?.addEventListener('click', () => sendMessage('save-bookmark'));
    document.getElementById('refresh-anchors')?.addEventListener('click', (e) => { e.stopPropagation(); sendMessage('request-bookmarks'); });

    // Footer controls
    document.getElementById('footer-fit')?.addEventListener('click', () => {
      try {
        const minHeight = 200;
        const maxHeight = 720;
        const contentHeight = computeVisibleContentBottomPx();
        const clamped = Math.max(minHeight, Math.min(maxHeight, contentHeight));
        sendMessage('resize-ui', { height: Math.ceil(clamped) });
      } catch (_) { /* no-op */ }
    });

    document.getElementById('footer-width-toggle')?.addEventListener('click', () => {
      try { sendMessage('toggle-width'); } catch (_) { /* no-op */ }
    });

    // Setup collapsible sections
    setupCollapsibleSections();
  }

  function setupCollapsibleSections() {





    const headers = document.querySelectorAll('.section-header.collapsible');
    headers.forEach(header => {
      header.addEventListener('click', () => toggleCollapsible(header));
    });
  }

  function toggleCollapsible(header) {
    const targetId = header.getAttribute('data-target');
    const target = document.getElementById(targetId);
    const arrow = header.querySelector('.arrow');
    
    if (target && arrow) {
      const isExpanded = header.getAttribute('aria-expanded') === 'true';
      header.setAttribute('aria-expanded', !isExpanded);
      target.classList.toggle('collapsed', isExpanded);
      arrow.textContent = isExpanded ? '+' : '-';
    }
  }

  function setupResizeHandle() {
    const handle = document.getElementById('footer-resize');
    if (!handle) return;

    let startY = 0;
    const minHeight = 150;
    const maxHeight = 720;

    function onPointerDown(e) {
      startY = e.clientY;
      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', onPointerUp, { once: true });
    }

    function onPointerMove(e) {
      const delta = e.clientY - startY;
      const newHeight = Math.max(minHeight, Math.min(maxHeight, window.innerHeight - delta));
      sendMessage('resize-ui', { height: newHeight });
    }

    function onPointerUp() {
      document.removeEventListener('pointermove', onPointerMove);
    }

    handle.addEventListener('pointerdown', onPointerDown);
  }

  function computeVisibleContentBottomPx() {
    let totalHeight = 0;

    const quickActions = document.getElementById('quick-actions');
    if (quickActions) totalHeight += quickActions.offsetHeight;

    const tagsHeader = document.getElementById('tags-header');
    const tagsContent = document.getElementById('color-section');
    if (tagsHeader) totalHeight += tagsHeader.offsetHeight;
    if (tagsContent && !tagsContent.classList.contains('collapsed')) {
      totalHeight += tagsContent.offsetHeight;
    }

    const anchorsHeader = document.getElementById('anchors-header');
    if (anchorsHeader) totalHeight += anchorsHeader.offsetHeight;

    const anchorsContainer = document.querySelector('.anchors-container');
    if (anchorsContainer) {
      const style = window.getComputedStyle(anchorsContainer);
      const pad = parseInt(style.paddingTop) + parseInt(style.paddingBottom);
      totalHeight += pad;
      const bookmarkList = document.getElementById('bookmark-list');
      if (bookmarkList) {
        const items = bookmarkList.querySelectorAll('.bookmark-item');
        for (var i = 0; i < items.length; i++) {
          var el = items[i];
          var height = 0;
          try {
            // offsetHeight exists on HTMLElements
            if (el && typeof (el).offsetHeight === 'number') {
              height = (el).offsetHeight;
            }
          } catch (_) { height = 0; }
          totalHeight += height || 0;
        }
      }
      const saveBtn = document.getElementById('save-bookmark');
      if (saveBtn) totalHeight += saveBtn.offsetHeight;
      totalHeight += 8; // gap
    }

    totalHeight += 16; // small bottom padding
    return totalHeight;
  }

  function checkAndRecoverFromCollapsedState() {
    try {
      const currentWidth = window.innerWidth;
      if (currentWidth < 160) {
        const tagsSection = document.getElementById('color-section');
        const tagsHeader = document.querySelector('[data-target="color-section"]');
        if (tagsSection && tagsHeader && tagsSection.classList.contains('collapsed')) {
          tagsSection.classList.remove('collapsed');
          const arrow = tagsHeader.querySelector ? tagsHeader.querySelector('.arrow') : null;
          if (arrow) {
            arrow.textContent = '-';
            if (tagsHeader.setAttribute) tagsHeader.setAttribute('aria-expanded', 'true');
          }
        }
        const desiredHeight = Math.max(352, window.innerHeight);
        sendMessage('resize-ui', { height: desiredHeight });
      }
    } catch (_) { /* no-op */ }
  }

  // Message handler
  window.addEventListener('message', (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    switch (msg.type) {
      case 'selection-state': {
        const emojis = msg.hasLayerSelected ? msg.layerEmojis : msg.pageEmojis;
        updateEmojiButtons(emojis);
        break;
      }
      case 'emoji-navigation-state': {
        const indicator = document.querySelector('#emoji-set-indicator .set-name');
        if (indicator && typeof msg.setName === 'string') {
          indicator.textContent = msg.setName;
        }
        document.getElementById('emoji-nav-left')?.removeAttribute('disabled');
        document.getElementById('emoji-nav-right')?.removeAttribute('disabled');
        break;
      }
      case 'bookmarks': {
        updateBookmarks(msg.bookmarks || []);
        break;
      }
      case 'navigation-state': {
        const backBtn = document.getElementById('back-btn');
        const fwdBtn = document.getElementById('forward-btn');
        if (backBtn) {
          if (msg.canGoBack) backBtn.removeAttribute('disabled'); else backBtn.setAttribute('disabled', '');
        }
        if (fwdBtn) {
          if (msg.canGoForward) fwdBtn.removeAttribute('disabled'); else fwdBtn.setAttribute('disabled', '');
        }
        break;
      }
      // Back-compat
      case 'update-emoji-buttons':
        updateEmojiButtons(msg.emojis);
        break;
      case 'update-bookmarks':
        updateBookmarks(msg.bookmarks);
        break;
      default:
        break;
    }
  });

  // Helper functions
  function updateEmojiButtons(emojis) {
    const container = document.getElementById('color-emoji-buttons');
    if (!container) return;
    
    container.innerHTML = '';
    emojis.forEach(emoji => {
      const button = document.createElement('button');
      button.className = 'emoji-button';
      button.textContent = emoji;
      button.addEventListener('click', () => sendMessage('add-emoji', { emoji }));
      container.appendChild(button);
    });
  }

  function updateBookmarks(bookmarks) {
    const list = document.getElementById('bookmark-list');
    if (!list) return;
    
    list.innerHTML = '';
    bookmarks.forEach(bookmark => {
      const li = document.createElement('li');
      li.className = 'bookmark-item';
      li.innerHTML = `
        <div class="bookmark-content">
          <div class="bookmark-name">${bookmark.name}</div>
          <div class="bookmark-page">${bookmark.pageName || 'Unknown Page'}</div>
        </div>
        <button class="bookmark-remove">×</button>
      `;
      
      li.querySelector('.bookmark-content')?.addEventListener('click', () => {
        sendMessage('jump-to-bookmark', { id: bookmark.id });
      });
      
      li.querySelector('.bookmark-remove')?.addEventListener('click', (event) => {
        event.stopPropagation();
        sendMessage('remove-bookmark', { id: bookmark.id });
      });
      
      list.appendChild(li);
    });
  }
  
  // Tooltip functions
  function scheduleTooltip(text, element) {
    cancelTooltip();
    hoverTimer = setTimeout(() => showTooltip(text, element), 500);
  }

  function cancelTooltip() {
    if (hoverTimer) {
      clearTimeout(hoverTimer);
      hoverTimer = null;
    }
    hideTooltip();
  }

  function showTooltip(text, element) {
    if (!tooltip) return;
    tooltip.textContent = text;
    tooltip.classList.add('visible');
    positionTooltip(element);
  }

  function hideTooltip() {
    if (!tooltip) return;
    tooltip.classList.remove('visible');
  }

  function positionTooltip(element) {
    if (!tooltip) return;
    const rect = element.getBoundingClientRect();
    const tooltipRect = tooltip.getBoundingClientRect();
    const left = rect.left + (rect.width - tooltipRect.width) / 2;
    const top = rect.top - tooltipRect.height - 8;
    
    tooltip.style.left = `${Math.max(8, Math.min(left, window.innerWidth - tooltipRect.width - 8))}px`;
    tooltip.style.top = `${Math.max(8, top)}px`;
  }
</script>
</body>
</html>
