<style>
  /* Use system fonts instead of external Google Fonts to avoid CSP issues */

  /* CSS Custom Properties for Responsive Design */
  /* 
    RESPONSIVE DESIGN SYSTEM
    ========================
    Easily adjust the entire UI by modifying these CSS variables:
    
    Spacing: --spacing-xs (2px) to --spacing-xxl (12px)
    Buttons: --button-height-sm (16px) to --button-height-lg (32px)  
    Icons: --icon-size-sm (8px) to --icon-size-xl (18px)
    Layout: --footer-height, --container-padding, --section-padding
    Borders: --border-radius-sm (3px) to --border-radius-xl (8px)
    Grids: --nav-grid-cols, --tags-grid-cols, --tags-actions-cols
    
    Example: Change --spacing-lg from 8px to 12px to increase all container padding
  */
  :root {
    /* Spacing System */
    --spacing-xs: 2px;
    --spacing-sm: 4px;
    --spacing-md: 6px;
    --spacing-lg: 8px;
    --spacing-xl: 10px;
    --spacing-xxl: 12px;
    
    /* Component Sizes */
    --button-height-sm: 16px;
    --button-height-md: 28px;
    --button-height-lg: 32px;
    --icon-size-sm: 8px;
    --icon-size-md: 12px;
    --icon-size-lg: 16px;
    --icon-size-xl: 18px;
    
    /* Layout Dimensions */
    --footer-height: 20px;
    --section-padding: var(--spacing-lg);
    --container-padding: var(--spacing-lg);
    --border-radius-sm: 3px;
    --border-radius-md: 4px;
    --border-radius-lg: 6px;
    --border-radius-xl: 8px;
    
    /* Content Constraints */
    --max-content-height: 300px;
    --badge-size: 14px;
    --arrow-width: 10px;
    --scrollbar-width: 2px;
    
    /* Grid Systems */
    --nav-grid-cols: repeat(4, 1fr);
    --tags-grid-cols: repeat(4, 1fr);
    --tags-actions-cols: 1fr 1fr;
    
    /* Responsive Breakpoints */
    --min-button-width: 40px;
    --max-section-width: 100%;
    
    /* Adaptive Sizing */
    --container-min-width: 160px;
    --container-max-width: 400px;
    
    /* Status Colors - Muted to match RGB tone */
    --color-cyan-muted: #7BC4C4;   /* softer cyan for onPage state */
    --color-magenta-muted: #C47BC4; /* softer magenta for onLayer state */
  }

  /* Responsive Grid Adjustments */
  @container (max-width: 180px) {
    :root {
      --nav-grid-cols: repeat(2, 1fr);
      --tags-grid-cols: repeat(2, 1fr);
      --spacing-lg: 6px;
      --spacing-xxl: 10px;
    }
  }

  @media (max-width: 160px) {
    :root {
      --nav-grid-cols: repeat(2, 1fr);
      --tags-grid-cols: repeat(2, 1fr);
      --tags-actions-cols: 1fr;
      --spacing-lg: 4px;
      --spacing-xxl: 8px;

  /* Base styles remain the same */

  /* Color +/- based on expanded state (IDE-like) */
  .section-header[aria-expanded="true"] .arrow { /* expanded shows '-' */
    color: #ff6b6b;
    font-weight: 300; /* match lighter heading when expanded */
  }
  .section-header[aria-expanded="false"] .arrow { /* collapsed shows '+' */
    color: #7ad96f;
    font-weight: 800; /* match boldest heading when collapsed */
  }

  /* Adjust heading weight by expanded/collapsed state */
  /* Ensure all headings (e.g., - NAV... onPage) use the same weights */
  .section-header[aria-expanded="true"] { /* expanded */
    font-weight: 300; /* lighter */
  }
  .section-header[aria-expanded="false"] { /* collapsed */
    font-weight: 800; /* boldest when collapsed */
  }

  /* Position-based +/- colors (RGB top→bottom) so order changes are respected */
  .section-header:nth-of-type(1) .arrow { /* top = red */
    color: #ff6b6b;
  }
  .section-header:nth-of-type(2) .arrow { /* middle = green */
    color: #6ede6e;
  }
  .section-header:nth-of-type(3) .arrow { /* bottom = blue */
    color: #6fb0ff;
  }
  /* Darker shades when collapsed */
  .section-header:nth-of-type(1)[aria-expanded="false"] .arrow { color: #b84d4d; }
  .section-header:nth-of-type(2)[aria-expanded="false"] .arrow { color: #4ea84e; }
  .section-header:nth-of-type(3)[aria-expanded="false"] .arrow { color: #4d7ccc; }

  .section-header:nth-of-type(3) .header-left span:not(.arrow) { /* Anchors - blue */

  .bookmark-remove {

  /* Make 'Drop Anchor' match the 'Remove Tag' button */

  #save-bookmark:hover {

  /* Tooltip */

  .tooltip.visible {

  /* Solid footer with centered handle and right-side icon */
  #footer {

  #footer-resize {

    border-radius: var(--border-radius-md);

  #footer-resize .grip {
    letter-spacing: var(--spacing-xs);

    opacity: 0.7;

  #footer-resize:hover, #footer-resize:focus {
    color: rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.04);
  }

  /* Right-side fit-to-content button */
  #footer-fit.footer-icon-btn {
    position: absolute;
    top: 0;
    right: 0;
    width: calc(var(--footer-height) + var(--spacing-sm));
    height: 100%;
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: var(--icon-size-sm);
    line-height: 1;
    border-left: 1px solid rgba(255, 255, 255, 0.06);
  }

  #footer-fit.footer-icon-btn:hover,
  #footer-fit.footer-icon-btn:focus {
    color: rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.04);
    outline: none;

</style>

<script>
  // Helper function to send messages to plugin
  function sendMessage(type, data = {}) {
    parent.postMessage({ pluginMessage: { type, ...data } }, '*');
  }

  // Helper function to escape HTML
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  // Configuration
  const MAX_TITLE_LENGTH = 20;
  const MAX_PAGE_TITLE_LENGTH = 32;
  
  // Helper function to truncate page titles
  function truncatePageTitle(text, maxLength = MAX_PAGE_TITLE_LENGTH) {
    if (text.length <= maxLength) return text;
    return text.substring(0, maxLength - 1) + '…';
  }

  // State
  let hasLayerSelected = false;
  let tooltip = null;
  let hoverTimer = null;

  // Initialize UI when DOM is ready
  window.addEventListener('DOMContentLoaded', () => {
    tooltip = document.getElementById('tooltip');
    sendMessage('ui-ready');
    setupEventListeners();
    setupResizeHandle();
  });

  function setupEventListeners() {
    // Quick Actions
    const newPageBtn = document.getElementById('new-page-btn');
    const deselectBtn = document.getElementById('deselect-btn');
    const resyncBtn = document.getElementById('resync-btn');
    // Navigation
    const navUpBtn = document.getElementById('nav-up');
    const navDownBtn = document.getElementById('nav-down');
    const navEnterBtn = document.getElementById('nav-enter');
    const navExitBtn = document.getElementById('nav-exit');
    const navCollapseBtn = document.getElementById('nav-collapse');

    newPageBtn?.addEventListener('click', (event) => handleCollapseSections(event));
    deselectBtn?.addEventListener('click', () => sendMessage('deselect'));
    resyncBtn?.addEventListener('click', () => sendMessage('resync-bookmarks'));
    navUpBtn?.addEventListener('click', () => sendMessage('nav-up'));
    navDownBtn?.addEventListener('click', () => sendMessage('nav-down'));
    navEnterBtn?.addEventListener('click', () => sendMessage('nav-enter'));
    navExitBtn?.addEventListener('click', () => sendMessage('nav-exit'));
    navCollapseBtn?.addEventListener('click', (event) => handleNewPage(event));

    // Delayed hover tooltips (200ms)
    const hoverTargets = [
      { el: newPageBtn, text: 'Collapse sections' },
      { el: deselectBtn, text: 'Deselect' },
      { el: resyncBtn, text: 'Resync' },
      { el: navUpBtn, text: 'Up' },
      { el: navDownBtn, text: 'Down' },
      { el: navEnterBtn, text: 'Enter folder' },
      { el: navExitBtn, text: 'Exit folder' },
      { el: navCollapseBtn, text: 'Collapse folders' },
    ];
    hoverTargets.forEach(({ el, text }) => {
      if (!el) return;
      el.addEventListener('mouseenter', () => scheduleTooltip(text, el));
      el.addEventListener('focus', () => scheduleTooltip(text, el));
      el.addEventListener('mouseleave', cancelTooltip);
      el.addEventListener('blur', cancelTooltip);
    });

    // Allow Esc to dismiss tooltip
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        cancelTooltip();
      }
    });
    
    // Color Section
    document.getElementById('add-date-btn')?.addEventListener('click', handleAddDate);
    document.getElementById('add-props-btn')?.addEventListener('click', () => sendMessage('add-props'));
    document.getElementById('clear-color')?.addEventListener('click', () => sendMessage('clear-emoji'));
    
    // Anchors
    document.getElementById('save-bookmark')?.addEventListener('click', () => sendMessage('save-bookmark'));

    // Footer fit-to-content
    document.getElementById('footer-fit')?.addEventListener('click', () => {
      try {
        const scrollable = document.querySelector('.scrollable-content');
        if (!scrollable) return;

        function computeVisibleContentBottomPx(container) {
          let maxBottom = 0;
          const collapsedContainers = Array.from(container.querySelectorAll('.collapsible-content.collapsed'));
          const selectors = [
            '#quick-actions',
            '.section-header',
            '.collapsible-content:not(.collapsed)',
            '.nav-container',
            '.color-grid-container',
            '.anchors-container',
            '#bookmark-list',
            '#save-bookmark'
          ];
          selectors.forEach((sel) => {
            container.querySelectorAll(sel).forEach((el) => {
              if (!(el instanceof HTMLElement)) return;
              if (el.offsetParent === null || el.offsetHeight === 0) return;
              // Skip any element inside a collapsed section
              const insideCollapsed = el.closest('.collapsible-content.collapsed');
              if (insideCollapsed) return;
              const bottom = el.offsetTop + el.offsetHeight;
              if (bottom > maxBottom) maxBottom = bottom;
            });
          });
          if (maxBottom === 0) {
            maxBottom = container.scrollHeight;
          }
          return Math.ceil(maxBottom);
        }

        const minHeight = 200;
        const maxHeight = 720;
        const footerHeight = 20; // fixed footer
        const bottomPx = computeVisibleContentBottomPx(scrollable);
        const desired = bottomPx + footerHeight;
        const clamped = Math.max(minHeight, Math.min(maxHeight, desired));
        sendMessage('resize-ui', { width: 184, height: clamped });
      } catch (_) {
        // no-op
      }
    });
    
    // Collapsibles
    document.querySelectorAll('.collapsible').forEach(header => {
      header.addEventListener('click', () => toggleCollapsible(header));
    });
  }

  function setupResizeHandle() {
    const handle = document.getElementById('footer-resize');
    if (!handle) return;

    let isDragging = false;
    let startY = 0;
    let startHeight = 0;

    const minHeight = 200; // prevent collapsing too far
    const maxHeight = 720; // reasonable cap for plugin modal

    function onPointerDown(e) {
      isDragging = true;
      startY = e.clientY;
      // Use current container height (viewport height of plugin UI)
      startHeight = window.innerHeight;
      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', onPointerUp, { once: true });
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const delta = e.clientY - startY;
      let next = Math.max(minHeight, Math.min(maxHeight, startHeight + delta));
      // Send resize request to host (width fixed at 184)
      sendMessage('resize-ui', { width: 184, height: Math.round(next) });
    }

    function onPointerUp() {
      isDragging = false;
      document.removeEventListener('pointermove', onPointerMove);
    }

    handle.addEventListener('pointerdown', onPointerDown);

    // Keyboard accessible resizing (Up/Down arrows)
    handle.addEventListener('keydown', (e) => {
      const step = (e.shiftKey ? 40 : 20);
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        const delta = e.key === 'ArrowUp' ? -step : step;
        const next = Math.max(minHeight, Math.min(maxHeight, window.innerHeight + delta));
        sendMessage('resize-ui', { width: 184, height: Math.round(next) });
        e.preventDefault();
      }
    });
  }

  // Removed layer collapse logic from quick action; see handleCollapseSections

  function handleAddDate() {
    sendMessage('add-date-smart');
  }

  function showTooltip(text, element) {
    if (!tooltip) return;
    
    const rect = element.getBoundingClientRect();
    tooltip.textContent = text;
    // Center horizontally under the button
    const tooltipWidth = tooltip.offsetWidth || 0;
    const left = rect.left + Math.max(0, (rect.width - tooltipWidth) / 2);
    tooltip.style.left = left + 'px';
    tooltip.style.top = (rect.bottom + 6) + 'px';
    tooltip.classList.add('visible');
  }

  function scheduleTooltip(text, element) {
    cancelTooltip();
    hoverTimer = setTimeout(() => {
      showTooltip(text, element);
    }, 200);
  }

  function cancelTooltip() {
    if (hoverTimer) {
      clearTimeout(hoverTimer);
      hoverTimer = null;
    }
    if (tooltip) {
      tooltip.classList.remove('visible');
    }
  }

  function handleCollapseSections(event) {
    try {
      const headers = Array.from(document.querySelectorAll('.section-header'));
      headers.forEach((header) => {
        const targetId = header.getAttribute('data-target');
        const content = targetId ? document.getElementById(targetId) : null;
        const arrow = header.querySelector('.arrow');
        if (!content || !arrow) return;
        if (!content.classList.contains('collapsed')) {
          content.classList.add('collapsed');
          arrow.textContent = '+';
          header.setAttribute('aria-expanded', 'false');
        }
      });
      showTooltip('Collapsed sections', event.target);
    } catch (_) {
      // no-op
    }
  }

  function renderEmojiButtons(emojis) {
    const container = document.getElementById('color-emoji-buttons');
    if (!container) return;
    
    container.innerHTML = '';
    emojis.forEach(emoji => {
      const button = document.createElement('button');
      button.className = 'emoji-button';
      button.textContent = emoji;
      button.addEventListener('click', () => sendMessage('add-emoji', { emoji }));
      container.appendChild(button);
    });
  }

  function updateSelectionIndicator(hasSelection) {
    const tagsBadge = document.getElementById('tags-badge');
    const navigationBadge = document.getElementById('navigation-badge');
    const anchorsBadge = document.getElementById('anchors-badge');
    const collapseBtn = document.getElementById('new-page-btn');
    const deselectBtn = document.getElementById('deselect-btn');
    const navExitBtn = document.getElementById('nav-exit');
    const navEnterBtn = document.getElementById('nav-enter');
    const navCollapseBtn = document.getElementById('nav-collapse');
    const statusIndicator = document.getElementById('status-indicator');
    
    if (tagsBadge) {
      // Show bullet instead of text; color will be synced below
      tagsBadge.textContent = '*';
    }
    if (navigationBadge) {
      navigationBadge.textContent = '*';
    }
    
    // Keep Anchors badge as "onLayer" regardless of selection state
    if (anchorsBadge) {
      anchorsBadge.textContent = '*';
    }
    
    // Keep quick action Collapse sections button enabled regardless of selection
    if (collapseBtn) {
      collapseBtn.disabled = false;
      collapseBtn.setAttribute('aria-disabled', 'false');
    }
    if (deselectBtn) {
      deselectBtn.disabled = !hasSelection;
    }

    // Disable navigation actions that require a selection when onPage
    if (navExitBtn) {
      navExitBtn.disabled = !hasSelection;
      navExitBtn.setAttribute('aria-disabled', String(!hasSelection));
    }
    if (navEnterBtn) {
      navEnterBtn.disabled = !hasSelection;
      navEnterBtn.setAttribute('aria-disabled', String(!hasSelection));
    }
    if (navCollapseBtn) {
      // Disable when onPage (no selection)
      navCollapseBtn.disabled = !hasSelection;
      navCollapseBtn.setAttribute('aria-disabled', String(!hasSelection));
    }

    // Update status indicator and colors
    const isLayer = hasSelection;
    const label = isLayer ? 'onLayer' : 'onPage';
    const color = isLayer ? '#C47BC4' /* muted magenta */ : '#7BC4C4' /* muted cyan */;

    if (statusIndicator) {
      statusIndicator.textContent = label;
      statusIndicator.style.color = color;
      statusIndicator.style.borderColor = color;
    }
    // Sync section bullets to the state color, but keep Anchors magenta always
    [tagsBadge, navigationBadge].forEach((el) => {
      if (el) el.style.color = color;
    });
    if (anchorsBadge) anchorsBadge.style.color = '#C47BC4';
  }

  function toggleCollapsible(header) {
    const targetId = header.getAttribute('data-target');
    const content = document.getElementById(targetId);
    const arrow = header.querySelector('.arrow');
    
    if (!content || !arrow) return;
    
    const isCollapsed = content.classList.toggle('collapsed');
    arrow.textContent = isCollapsed ? '+' : '-';
    
    // Update ARIA attributes
    header.setAttribute('aria-expanded', !isCollapsed);
  }

  function renderBookmarks(bookmarks) {
    const list = document.getElementById('bookmark-list');
    if (!list) return;
    
    list.innerHTML = '';
    bookmarks.forEach((bookmark) => {
      const li = document.createElement('li');
      li.className = 'bookmark-item';
      const pageName = bookmark.pageName || 'Unknown Page';
      const truncatedPageName = truncatePageTitle(pageName);
      
      li.innerHTML = `
        <div class="bookmark-content">
          <span class="bookmark-name" title="${escapeHtml(bookmark.name)}">${escapeHtml(bookmark.name)}</span>
          <span class="bookmark-page" title="${escapeHtml(pageName)}">${escapeHtml(truncatedPageName)}</span>
        </div>
        <button class="bookmark-remove" title="Remove">×</button>
      `;
      
      li.querySelector('.bookmark-content')?.addEventListener('click', () => {
        sendMessage('jump-to-bookmark', { id: bookmark.id });
      });
      
      li.querySelector('.bookmark-remove')?.addEventListener('click', (event) => {
        event.stopPropagation();
        sendMessage('remove-bookmark', { id: bookmark.id });
      });
      
      list.appendChild(li);
    });
  }

  // Listen for messages from plugin
  window.addEventListener('message', (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    
    switch (msg.type) {
      case 'bookmarks':
        renderBookmarks(msg.bookmarks);
        break;
        
             case 'selection-state':
         hasLayerSelected = msg.hasLayerSelected;
         renderEmojiButtons(hasLayerSelected ? msg.layerEmojis : msg.pageEmojis);
         updateSelectionIndicator(hasLayerSelected);
         break;
        
      case 'show-tooltip':
        if (msg.elementId) {
          const element = document.getElementById(msg.elementId);
          if (element) showTooltip(msg.text, element);
        }
        break;
    }
  });
</script>
