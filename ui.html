<script>
  // Helper function to send messages to plugin
  function sendMessage(type, data = {}) {
    parent.postMessage({ pluginMessage: { type, ...data } }, '*');
  }

  // Helper function to escape HTML
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Helper function to truncate text with ellipsis in the middle
  function truncateWithMiddleEllipsis(text, maxLength = 24) {
    // Trim leading spaces to preserve actual title content
    const trimmedText = text.replace(/^\s+/, '');
    const leadingSpaces = text.length - trimmedText.length;
    
    if (trimmedText.length <= maxLength) {
      return text; // Return original if trimmed text fits
    }
    
    // Keep 10 characters on the back end, rest goes to front
    const endLength = 10;
    const startLength = maxLength - endLength - 1; // 1 for "…"
    const start = trimmedText.substring(0, startLength);
    const end = trimmedText.substring(trimmedText.length - endLength);
    
    // Reconstruct with original leading spaces
    const originalLeadingSpaces = text.substring(0, leadingSpaces);
    return originalLeadingSpaces + start + '…' + end;
  }

  // Track currently selected emoji for page operations


  // Initialize UI when DOM is ready
  window.addEventListener('DOMContentLoaded', () => {
    sendMessage('ui-ready');
    
    // Set up event listeners
    setupEventListeners();
  });

  function setupEventListeners() {
    // Color emoji buttons
    document.querySelectorAll('.emoji-button').forEach(button => {
      button.addEventListener('click', () => {
        const emoji = button.textContent?.trim();
        if (emoji) {
          sendMessage('add-emoji', { emoji });
        }
      });
    });

    // Clear Color button
    const clearButton = document.getElementById('clear-color');
    if (clearButton) {
      clearButton.addEventListener('click', () => {
        sendMessage('clear-emoji');
      });
    }



    // Save Bookmark button
    const saveButton = document.getElementById('save-bookmark');
    if (saveButton) {
      saveButton.addEventListener('click', () => {
        sendMessage('save-bookmark');
      });
    }

    // Collapsible sections
    document.querySelectorAll('.collapsible').forEach(header => {
      header.addEventListener('click', () => {
        toggleCollapsible(header);
      });
    });
  }

  function toggleCollapsible(header) {
    const targetId = header.getAttribute('data-target');
    const content = document.getElementById(targetId);
    const arrow = header.querySelector('.arrow');
    
    if (!content || !arrow) return;
    
    const isCollapsed = content.classList.contains('collapsed');
    
    if (isCollapsed) {
      content.classList.remove('collapsed');
      arrow.textContent = '-';
    } else {
      content.classList.add('collapsed');
      arrow.textContent = '+';
    }
  }

  // Render bookmarks list
  function renderBookmarks(bookmarks) {
    const list = document.getElementById('bookmark-list');
    if (!list) return;
    
    list.innerHTML = '';
    
    // Add divider above the list
    if (bookmarks.length > 0) {
      const topDivider = document.createElement('div');
      topDivider.className = 'bookmark-divider';
      topDivider.textContent = ' - - - - - - - - - - - - - - -';
      list.appendChild(topDivider);
    }
    
    bookmarks.forEach((bookmark, index) => {
      // Add bookmark item
      const li = document.createElement('li');
      li.className = 'bookmark-item';
      const pageName = bookmark.pageName || 'Unknown Page';
      const truncatedPageName = pageName.length > 24 ? truncateWithMiddleEllipsis(pageName, 24) : pageName;
      
      li.innerHTML = `
        <div class="bookmark-content">
          <span class="bookmark-name" title="${escapeHtml(bookmark.name)}">${escapeHtml(bookmark.name)}</span>
          <span class="bookmark-page" title="${escapeHtml(pageName)}">${escapeHtml(truncatedPageName)}</span>
        </div>
        <button class="bookmark-remove" title="Remove">x</button>
      `;
      
      // Jump to bookmark on content area click
      const contentArea = li.querySelector('.bookmark-content');
      if (contentArea) {
        contentArea.addEventListener('click', () => {
          sendMessage('jump-to-bookmark', { id: bookmark.id });
        });
      }
      
      // Remove bookmark on remove button click
      const removeButton = li.querySelector('.bookmark-remove');
      if (removeButton) {
        removeButton.addEventListener('click', (event) => {
          event.stopPropagation();
          sendMessage('remove-bookmark', { id: bookmark.id });
        });
      }
      
      list.appendChild(li);
      
      // Add divider after each bookmark (except the last one)
      if (index < bookmarks.length - 1) {
        const divider = document.createElement('div');
        divider.className = 'bookmark-divider';
        divider.textContent = ' - - - - - - - - - - - - - - - ';
        list.appendChild(divider);
      }
    });
    
    // Add divider below the list
    if (bookmarks.length > 0) {
      const bottomDivider = document.createElement('div');
      bottomDivider.className = 'bookmark-divider';
      bottomDivider.textContent = ' - - - - - - - - - - - - - - - ';
      list.appendChild(bottomDivider);
    }
  }

  // Listen for messages from plugin
  window.addEventListener('message', (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    
    switch (msg.type) {
      case 'bookmarks':
        renderBookmarks(msg.bookmarks);
        break;
      default:
        console.warn('Unknown message type:', msg.type);
    }
  });
</script>
