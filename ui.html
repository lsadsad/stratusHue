<h2>Add Emoji to Layer Name</h2>
<p>Select a layer and choose an emoji to add, replace, or clear:</p>
<div id="emoji-buttons">
  <button class="emoji-button">🔴</button>
  <button class="emoji-button">🟠</button>
  <button class="emoji-button">🟡</button>
  <button class="emoji-button">🟢</button>
  <button class="emoji-button">🔵</button>
  <button class="emoji-button">🟣</button>
  <button class="emoji-button">⚫️</button>
  <button class="emoji-button">⚪️</button>
</div>
<div id="action-buttons">
    <button id="clear">Clear Emoji</button>
    <button id="cancel">Cancel</button>
</div>

<style>
  body {
    padding: 10px;
    box-sizing: border-box;
  }
  #emoji-buttons {
    margin-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
  }
  .emoji-button {
    font-size: 16px;
    padding: 5px 10px;
    margin-right: 5px;
    margin-bottom: 5px;
    cursor: pointer;
  }
  #action-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
  }
</style>

<script>
  // Send message to add/replace emoji
  document.querySelectorAll('.emoji-button').forEach(button => {
    button.onclick = () => {
      const emoji = button.textContent;
      parent.postMessage({ pluginMessage: { type: 'add-emoji', emoji } }, '*')
    }
  });

  // Send message to clear emoji
  document.getElementById('clear').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'clear-emoji' } }, '*')
  }

  // Send message to close plugin
  document.getElementById('cancel').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*')
  }
</script>
