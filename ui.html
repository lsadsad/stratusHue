<p>Select Layer</p>
<div id="emoji-buttons">
  <button class="emoji-button">🔴</button>
  <button class="emoji-button">🟠</button>
  <button class="emoji-button">🟡</button>
  <button class="emoji-button">🟢</button>
  <button class="emoji-button">🔵</button>
  <button class="emoji-button">🟣</button>
  <button class="emoji-button">⚫️</button>
  <button class="emoji-button">⚪️</button>
</div>
<div id="action-buttons">
    <button id="clear">Clear</button>
</div>

<style>
  @import url('https://fonts.googleapis.com/css?family=Source+Code+Pro:400,700&display=swap');
  body {
    padding: 8px;
    font-family: 'Source Code Pro', monospace;
    font-size: 12px; /* or any size you prefer */
  }
  #emoji-buttons {
    margin-bottom: 16px; /* Space between emojis and clear button */
    display: flex;
    flex-wrap: wrap;
  }
  .emoji-button {
    font-size: 16px;
    padding: 5px 8px;
    cursor: pointer;
    font-family: 'Source Code Pro', monospace;
  }
  #action-buttons {
    display: flex;
    justify-content: center; /* Center the Clear button */
    margin-top: 0;
  }
  #clear {
    width: auto;
    min-width: 64px;
    padding: 5px 16px;
    font-family: 'Source Code Pro', monospace;
  }
  p {
    font-family: 'Source Code Pro', monospace;
  }
</style>

<script>
  // Send message to add/replace emoji
  document.querySelectorAll('.emoji-button').forEach(button => {
    button.onclick = () => {
      const emoji = button.textContent;
      parent.postMessage({ pluginMessage: { type: 'add-emoji', emoji } }, '*')
    }
  });

  // Send message to clear emoji
  document.getElementById('clear').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'clear-emoji' } }, '*')
  }
</script>
