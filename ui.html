<div class="scrollable-content">
  <div id="toolbar">
    <button id="add-date-btn" class="toolbar-btn">Add New Page</button>
  </div>

  <h2 class="section-header collapsible" data-target="color-section">
    <span>## Add Color <span id="selection-indicator">(Page)</span></span>
    <span class="arrow">-</span>
  </h2>
  <div id="color-section" class="collapsible-content">
    <div id="color-emoji-buttons">
      </div>
    <div id="clear-color-section">
      <button id="clear-color">Clear Color</button>
    </div>
  </div>

  <h2 class="section-header collapsible" data-target="anchors-section">
    <span>## ANCHORS</span>
    <span class="arrow">-</span>
  </h2>
  <div id="anchors-section" class="collapsible-content">
    <ul id="bookmark-list"></ul>
    <button id="save-bookmark">⚓ Drop Anchor</button>
  </div>
</div>

<script>
  // Helper function to send messages to plugin
  function sendMessage(type, data = {}) {
    parent.postMessage({ pluginMessage: { type, ...data } }, '*');
  }

  // Helper function to escape HTML
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  // Configuration - adjust these values as needed
  const MAX_TITLE_LENGTH = 20; // Change this number to adjust title length
  
  // Helper function to truncate text with ellipsis in the middle
  function truncateWithMiddleEllipsis(text, maxLength = MAX_TITLE_LENGTH) {
    const trimmedText = text.replace(/^\s+/, '');
    const leadingSpaces = text.length - trimmedText.length;
    if (trimmedText.length <= maxLength) { return text; }
    const endLength = 10;
    const startLength = maxLength - endLength - 1; // 1 for "…"
    const start = trimmedText.substring(0, startLength);
    const end = trimmedText.substring(trimmedText.length - endLength);
    const originalLeadingSpaces = text.substring(0, leadingSpaces);
    return originalLeadingSpaces + start + '…' + end;
  }

  let hasLayerSelected = false;

  // Initialize UI when DOM is ready
  window.addEventListener('DOMContentLoaded', () => {
    sendMessage('ui-ready');
    setupEventListeners();
  });

  function setupEventListeners() {
    document.getElementById('clear-color')?.addEventListener('click', () => sendMessage('clear-emoji'));
    document.getElementById('save-bookmark')?.addEventListener('click', () => sendMessage('save-bookmark'));
    document.getElementById('add-date-btn')?.addEventListener('click', () => sendMessage('add-date-title'));
    document.querySelectorAll('.collapsible').forEach(header => {
      header.addEventListener('click', () => toggleCollapsible(header));
    });
  }

  function generateDateTitle() {
    const now = new Date();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const dateString = `${month}.${day}`;
    return `    ↳ 🟢${dateString} : `;
  }

  function renderEmojiButtons(emojis) {
    const container = document.getElementById('color-emoji-buttons');
    if (!container) return;
    container.innerHTML = '';
    emojis.forEach(emoji => {
      const button = document.createElement('button');
      button.className = 'emoji-button';
      button.textContent = emoji;
      button.addEventListener('click', () => sendMessage('add-emoji', { emoji }));
      container.appendChild(button);
    });
  }

  function updateDynamicUI(hasLayerSelected) {
    const dateBtn = document.getElementById('add-date-btn');
    const indicator = document.getElementById('selection-indicator');
    if (dateBtn) {
      dateBtn.textContent = hasLayerSelected ? 'Add Date to Layer' : 'Add New Page';
    }
    if (indicator) {
      indicator.textContent = hasLayerSelected ? '(Layer)' : '(Page)';
    }
  }

  function toggleCollapsible(header) {
    const targetId = header.getAttribute('data-target');
    const content = document.getElementById(targetId);
    const arrow = header.querySelector('.arrow');
    if (!content || !arrow) return;
    const isCollapsed = content.classList.toggle('collapsed');
    arrow.textContent = isCollapsed ? '+' : '-';
  }

  function renderBookmarks(bookmarks) {
    const list = document.getElementById('bookmark-list');
    if (!list) return;
    list.innerHTML = '';
    bookmarks.forEach((bookmark) => {
      const li = document.createElement('li');
      li.className = 'bookmark-item';
      const pageName = bookmark.pageName || 'Unknown Page';
      const truncatedBookmarkName = bookmark.name.length > MAX_TITLE_LENGTH ? bookmark.name.substring(0, MAX_TITLE_LENGTH) + '…' : bookmark.name;
      
      li.innerHTML = `
        <div class="bookmark-content">
          <span class="bookmark-name" title="${escapeHtml(bookmark.name)}">${escapeHtml(truncatedBookmarkName)}</span>
          <span class="bookmark-page" title="${escapeHtml(pageName)}">${escapeHtml(pageName)}</span>
        </div>
        <button class="bookmark-remove" title="Remove">x</button>
      `;
      
      li.querySelector('.bookmark-content')?.addEventListener('click', () => sendMessage('jump-to-bookmark', { id: bookmark.id }));
      li.querySelector('.bookmark-remove')?.addEventListener('click', (event) => {
        event.stopPropagation();
        sendMessage('remove-bookmark', { id: bookmark.id });
      });
      list.appendChild(li);
    });
  }

  // Listen for messages from plugin
  window.addEventListener('message', (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    
    switch (msg.type) {
      case 'bookmarks':
        renderBookmarks(msg.bookmarks);
        break;
      case 'selection-state':
        hasLayerSelected = msg.hasLayerSelected;
        renderEmojiButtons(hasLayerSelected ? msg.layerEmojis : msg.pageEmojis);
        updateDynamicUI(hasLayerSelected);
        break;
    }
  });
</script>
