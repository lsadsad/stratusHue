<p class="section-header">Add color:</p>
<div id="color-emoji-buttons">
  <button class="emoji-button">🔴</button>
  <button class="emoji-button">🟠</button>
  <button class="emoji-button">🟡</button>
  <button class="emoji-button">🟢</button>
  <button class="emoji-button">🔵</button>
  <button class="emoji-button">🟣</button>
  <button class="emoji-button">⚫️</button>
  <button class="emoji-button">⚪️</button>
</div>
<div id="clear-color-section">
  <button id="clear-color">Clear Color</button>
</div>

<p class="section-header">Bookmarks:</p>
<div id="bookmark-section">
  <button id="save-bookmark">Save Bookmark</button>
  <ul id="bookmark-list"></ul>
</div>

<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    box-sizing: border-box;
  }
  body {
    padding: 8px;
    min-width: 220px;
    min-height: 320px;
    max-width: 260px;
    max-height: 420px;
    overflow: hidden;
  }
  body, button, p {
    font-family: 'Source Code Pro', 'Courier New', Courier, monospace;
    font-weight: bold;
  }
  p {
    font-size: 12px;
  }
  #color-emoji-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-gap: 8px;
    margin-bottom: 12px;
    max-width: 180px;
  }
  .emoji-button {
    font-size: 18px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid #ddd;
    background: #fff;
    transition: background 0.2s, border 0.2s;
    box-sizing: border-box;
    padding: 0;
    margin: 0;
  }
  .emoji-button:hover {
    background: #f0f0f0;
    border: 1px solid #aaa;
  }
  #clear-color-section {
    margin-bottom: 12px;
    display: flex;
    gap: 8px;
  }
  #clear-color-section {
    margin-top: 0;
  }
  #action-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
  }
  #clear {
    padding: 4px 8px;
    font-size: 12px;
  }
  .section-header {
    font-size: 13px;
    margin: 16px 0 8px 0;
    font-weight: bold;
    letter-spacing: 0.5px;
  }
  .section-header:first-child {
    margin-top: 0;
  }
  .section-divider {
    border: none;
    border-top: 1px solid #e0e0e0;
    margin: 18px 0 10px 0;
  }
  #bookmark-section {
    margin-bottom: 18px;
  }
  #save-bookmark {
    margin-bottom: 10px;
    padding: 6px 14px;
    font-size: 13px;
    border-radius: 6px;
    border: 1px solid #bbb;
    background: #f7f7f7;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s, border 0.2s;
  }
  #save-bookmark:hover {
    background: #e0e0e0;
    border: 1px solid #888;
  }
  #bookmark-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .bookmark-item {
    display: flex;
    align-items: center;
    margin-bottom: 6px;
    font-size: 13px;
    background: #f9f9f9;
    border-radius: 4px;
    padding: 4px 8px;
  }
  .bookmark-icon {
    color: #0099ff;
    margin-right: 6px;
    font-size: 15px;
  }
  .bookmark-name {
    flex: 1;
    cursor: pointer;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bookmark-remove {
    color: #e74c3c;
    background: none;
    border: none;
    font-size: 15px;
    cursor: pointer;
    margin-left: 8px;
    padding: 0 2px;
    border-radius: 3px;
    transition: background 0.2s;
  }
  .bookmark-remove:hover {
    background: #ffeaea;
  }
</style>

<script>
  // Notify plugin UI is ready
  window.addEventListener('DOMContentLoaded', () => {
    parent.postMessage({ pluginMessage: { type: 'ui-ready' } }, '*');
  });

  // Color emoji buttons
  document.querySelectorAll('.emoji-button').forEach(button => {
    button.onclick = () => {
      const emoji = button.textContent;
      if (emoji && emoji.trim()) {
        parent.postMessage({ pluginMessage: { type: 'add-emoji', emoji: emoji.trim() } }, '*');
      }
    };
  });

  // Clear Color button
  document.getElementById('clear-color').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'clear-emoji' } }, '*');
  };

  // Save Bookmark button
  document.getElementById('save-bookmark').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'save-bookmark' } }, '*');
  };

  // Render bookmarks list
  function renderBookmarks(bookmarks) {
    const list = document.getElementById('bookmark-list');
    list.innerHTML = '';
    bookmarks.forEach(b => {
      const li = document.createElement('li');
      li.className = 'bookmark-item';
      li.innerHTML = `
        <span class="bookmark-icon">🔖</span>
        <span class="bookmark-name" title="${b.name}">${b.name}</span>
        <button class="bookmark-remove" title="Remove">❌</button>
      `;
      // Jump to bookmark on name click
      li.querySelector('.bookmark-name').onclick = () => {
        parent.postMessage({ pluginMessage: { type: 'jump-to-bookmark', id: b.id } }, '*');
      };
      // Remove bookmark on ❌ click
      li.querySelector('.bookmark-remove').onclick = () => {
        parent.postMessage({ pluginMessage: { type: 'remove-bookmark', id: b.id } }, '*');
      };
      list.appendChild(li);
    });
  }

  // Listen for messages from plugin
  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'bookmarks') {
      renderBookmarks(msg.bookmarks);
    }
  };
</script>
