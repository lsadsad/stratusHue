<link href="https://fonts.googleapis.com/css?family=Source+Code+Pro:400,700&display=swap" rel="stylesheet">

<p>Select a layer:</p>
<div id="emoji-buttons">
  <button class="emoji-button">🔴</button>
  <button class="emoji-button">🟠</button>
  <button class="emoji-button">🟡</button>
  <button class="emoji-button">🟢</button>
  <button class="emoji-button">🔵</button>
  <button class="emoji-button">🟣</button>
  <button class="emoji-button">⚫️</button>
  <button class="emoji-button">⚪️</button>
</div>
<div id="action-buttons">
    <button id="clear">Clear Emoji</button>
</div>

<style>
  body, button, p {
    font-family: 'Source Code Pro','Courier New', Courier, monospace;
    font-weight: bold;
  }
  body {
    padding: 8px;
  }
  p {
    font-size: 16px;
  }
  #emoji-buttons {
    display: flex;
    flex-wrap: wrap;
  }
  .emoji-button {
    font-size: 16px;
    padding: 8px 8px;
    cursor: pointer;
  }
  #action-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
  }
  #clear {
    padding: 4px 8px;
    font-size: 16px;
  }
</style>

<script>
  // Send message to add/replace emoji
  document.querySelectorAll('.emoji-button').forEach(button => {
    button.onclick = () => {
      const emoji = button.textContent;
      if (emoji && emoji.trim()) {
        parent.postMessage({ pluginMessage: { type: 'add-emoji', emoji: emoji.trim() } }, '*');
      }
    }
  });

  // Send message to clear emoji
  document.getElementById('clear').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'clear-emoji' } }, '*');
  }
</script>
