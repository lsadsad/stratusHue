<h2>Add Emoji to Layer Name</h2>
<p>Select a layer and choose an emoji to add to its name:</p>
<div id="emoji-buttons">
  <button class="emoji-button">🔴</button>
  <button class="emoji-button">🟠</button>
  <button class="emoji-button">🟡</button>
  <button class="emoji-button">🟢</button>
  <button class="emoji-button">🔵</button>
  <button class="emoji-button">🟣</button>
  <button class="emoji-button">⚫️</button>
  <button class="emoji-button">⚪️</button>
</div>
<button id="cancel">Cancel</button>

<style>
  body {
    padding: 10px;
  }
  #emoji-buttons {
    margin-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
  }
  .emoji-button {
    font-size: 16px;
    padding: 5px 10px;
    margin-right: 5px;
    margin-bottom: 5px;
    cursor: pointer;
  }
</style>

<script>
  document.querySelectorAll('.emoji-button').forEach(button => {
    button.onclick = () => {
      const emoji = button.textContent;
      parent.postMessage({ pluginMessage: { type: 'add-emoji', emoji } }, '*')
    }
  });

  document.getElementById('cancel').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*')
  }
</script>
