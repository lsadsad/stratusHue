<h3 class="section-header">Add Color</h3>
<div id="color-emoji-buttons">
  <button class="emoji-button">🔴</button>
  <button class="emoji-button">🟠</button>
  <button class="emoji-button">🟡</button>
  <button class="emoji-button">🟢</button>
  <button class="emoji-button">🔵</button>
  <button class="emoji-button">🟣</button>
  <button class="emoji-button">⚫️</button>
  <button class="emoji-button">⚪️</button>
</div>
<div id="clear-color-section">
  <button id="clear-color">Clear Color</button>
</div>

<h3 class="section-header">Anchors</h3>
<div id="bookmark-section">
  <button id="save-bookmark">Drop Anchor</button>
  <ul id="bookmark-list"></ul>
</div>

<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    box-sizing: border-box;
  }
  body {
    padding: 16px 8px 8px 8px;
    min-width: 176px;
    min-height: 256px;
    max-width: 208px;
    max-height: 336px;
    overflow-y: auto;
    overflow-x: hidden;
  }

  /* Custom scrollbar styling */
  body::-webkit-scrollbar {
    width: 8px;
  }

  body::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 4px;
  }

  body::-webkit-scrollbar-thumb {
    background: #c1c1c1;
    border-radius: 4px;
    transition: background 0.2s ease;
  }

  body::-webkit-scrollbar-thumb:hover {
    background: #a8a8a8;
  }

  /* Firefox scrollbar styling */
  body {
    scrollbar-width: thin;
    scrollbar-color: #c1c1c1 #f1f1f1;
  }
  body, button, h3 {
    font-family: 'Source Code Pro', 'Courier New', Courier, monospace;
    font-weight: bold;
  }
  #color-emoji-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-gap: 6px;
    margin-bottom: 6px;
    max-width: 144px;
    margin-left: auto;
    margin-right: auto;
  }
  .emoji-button {
    font-size: 12px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    border-radius: 5px;
    border: 1px solid #ddd;
    background: #fff;
    transition: background 0.2s, border 0.2s;
    box-sizing: border-box;
    padding: 0;
    margin: 0;
  }
  .emoji-button:hover {
    background: #f0f0f0;
    border: 1px solid #aaa;
  }
  #clear-color-section {
    margin-bottom: 0;
    display: flex;
    justify-content: center;
  }
  #action-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
  }
  #clear-color {
    padding: 5px 10px;
    font-size: 9px;
    border-radius: 5px;
    border: 1px solid #ddd;
    background: transparent;
    color: #ddd;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s ease;
  }
  #clear-color:hover {
    background: #f7f7f7;
    border: 1px solid #bbb;
    color: #bbb;
    transform: translateY(-1px);
  }

  .section-header {
    font-size: 10px;
    margin: 16px 0 10px 0;
    font-weight: bold;
    letter-spacing: 0.5px;
    color: #333;
    text-transform: uppercase;
    border-bottom: 2px solid #0099ff;
    padding-bottom: 3px;
    text-align: center;
  }
  .section-header:first-child {
    margin-top: 0;
  }
  .section-divider {
    border: none;
    border-top: 1px solid #e0e0e0;
    margin: 18px 0 10px 0;
  }
  #bookmark-section {
    margin-bottom: 0;
  }
  #save-bookmark {
    margin-bottom: 10px;
    padding: 6px 12px;
    font-size: 10px;
    border-radius: 5px;
    border: 1px solid #0099ff;
    background: #0099ff;
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s ease;
    width: 100%;
  }
  #save-bookmark:hover {
    background: #007acc;
    border: 1px solid #007acc;
    transform: translateY(-1px);
    box-shadow: 0 2px 4px rgba(0, 153, 255, 0.3);
  }
  #bookmark-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .bookmark-item {
    display: flex;
    align-items: center;
    margin-bottom: 4px;
    font-size: 9px;
    background: white;
    border-radius: 4px;
    padding: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid #e8e8e8;
  }
  .bookmark-item:hover {
    background: #0099ff;
    color: #fff;
    border-color: #0099ff;
    transform: translateY(-1px);
    box-shadow: 0 4px 8px rgba(0, 153, 255, 0.3);
  }
  .bookmark-item:hover .bookmark-name {
    color: #fff;
  }
  .bookmark-item:hover .bookmark-icon {
    color: #fff;
  }
  .bookmark-icon {
    color: #0099ff;
    margin-right: 4px;
    font-size: 7px;
    flex-shrink: 0;
  }
  .bookmark-name {
    flex: 1;
    font-weight: 500;
    line-height: 1.2;
    word-wrap: break-word;
    overflow-wrap: break-word;
    hyphens: auto;
  }
  .bookmark-remove {
    color: #e74c3c;
    background: none;
    border: none;
    font-size: 6px;
    cursor: pointer;
    margin-left: 4px;
    padding: 2px;
    border-radius: 2px;
    transition: all 0.2s ease;
    opacity: 0.7;
    flex-shrink: 0;
  }
  .bookmark-remove:hover {
    background: #ffeaea;
    opacity: 1;
    transform: scale(1.1);
  }
</style>

<script>
  // Notify plugin UI is ready
  window.addEventListener('DOMContentLoaded', () => {
    parent.postMessage({ pluginMessage: { type: 'ui-ready' } }, '*');
  });

  // Color emoji buttons
  document.querySelectorAll('.emoji-button').forEach(button => {
    button.onclick = () => {
      const emoji = button.textContent;
      if (emoji && emoji.trim()) {
        parent.postMessage({ pluginMessage: { type: 'add-emoji', emoji: emoji.trim() } }, '*');
      }
    };
  });

  // Clear Color button
  document.getElementById('clear-color').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'clear-emoji' } }, '*');
  };

  // Save Bookmark button
  document.getElementById('save-bookmark').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'save-bookmark' } }, '*');
  };

  // Render bookmarks list
  function renderBookmarks(bookmarks) {
    const list = document.getElementById('bookmark-list');
    list.innerHTML = '';
    bookmarks.forEach(b => {
      const li = document.createElement('li');
      li.className = 'bookmark-item';
      li.innerHTML = `
        <span class="bookmark-icon">⚓</span>
        <span class="bookmark-name" title="${b.name}">${b.name}</span>
        <button class="bookmark-remove" title="Remove">❌</button>
      `;
      // Jump to bookmark on list item click
      li.onclick = (event) => {
        // Don't trigger if clicking the remove button
        if (!event.target.classList.contains('bookmark-remove')) {
          parent.postMessage({ pluginMessage: { type: 'jump-to-bookmark', id: b.id } }, '*');
        }
      };
      // Remove bookmark on ❌ click
      li.querySelector('.bookmark-remove').onclick = (event) => {
        event.stopPropagation(); // Prevent triggering the list item click
        parent.postMessage({ pluginMessage: { type: 'remove-bookmark', id: b.id } }, '*');
      };
      list.appendChild(li);
    });
  }

  // Listen for messages from plugin
  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'bookmarks') {
      renderBookmarks(msg.bookmarks);
    }
  };
</script>
