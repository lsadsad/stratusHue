<script>
  // Helper function to send messages to plugin
  function sendMessage(type, data = {}) {
    parent.postMessage({ pluginMessage: { type, ...data } }, '*');
  }

  // Helper function to escape HTML
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  // Configuration
  const MAX_TITLE_LENGTH = 20;
  const MAX_PAGE_TITLE_LENGTH = 32;
  
  // Helper function to truncate page titles
  function truncatePageTitle(text, maxLength = MAX_PAGE_TITLE_LENGTH) {
    if (text.length <= maxLength) return text;
    return text.substring(0, maxLength - 1) + '…';
  }

  // State
  let hasLayerSelected = false;
  let tooltip = null;
  let hoverTimer = null;

  // Initialize UI when DOM is ready
  window.addEventListener('DOMContentLoaded', () => {
    tooltip = document.getElementById('tooltip');
    sendMessage('ui-ready');
    setupEventListeners();
    setupResizeHandle();
    
    // Auto-recovery mechanism for collapsed state
    setTimeout(() => {
      checkAndRecoverFromCollapsedState();
    }, 100);
  });

  function setupEventListeners() {
    // Quick Actions
    const deselectBtn = document.getElementById('deselect-btn');
    const resyncBtn = document.getElementById('resync-btn');

    deselectBtn?.addEventListener('click', () => sendMessage('deselect'));
    resyncBtn?.addEventListener('click', () => sendMessage('resync-bookmarks'));

    // Delayed hover tooltips (200ms)
    const hoverTargets = [
      { el: deselectBtn, text: 'Deselect' },
      { el: resyncBtn, text: 'Resync' },
    ];
    hoverTargets.forEach(({ el, text }) => {
      if (!el) return;
      el.addEventListener('mouseenter', () => scheduleTooltip(text, el));
      el.addEventListener('focus', () => scheduleTooltip(text, el));
      el.addEventListener('mouseleave', cancelTooltip);
      el.addEventListener('blur', cancelTooltip);
    });

    // Allow Esc to dismiss tooltip
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        cancelTooltip();
      }
    });
    
    // Color Section
    document.getElementById('add-date-btn')?.addEventListener('click', handleAddDate);
    document.getElementById('add-props-btn')?.addEventListener('click', () => sendMessage('add-props'));
    document.getElementById('clear-color')?.addEventListener('click', () => sendMessage('clear-emoji'));
    
    // Anchors
    document.getElementById('save-bookmark')?.addEventListener('click', () => sendMessage('save-bookmark'));

    // Footer fit-to-content
    document.getElementById('footer-fit')?.addEventListener('click', () => {
      try {
        const scrollable = document.querySelector('.scrollable-content');
        if (!scrollable) return;

        function computeVisibleContentBottomPx(container) {
          let maxBottom = 0;
          
          // Check if all sections are collapsed
          const allSections = container.querySelectorAll('.collapsible-content');
          const allCollapsed = Array.from(allSections).every(section => section.classList.contains('collapsed'));
          
          if (allCollapsed) {
            // When all collapsed, only measure quick actions and section headers
            const selectors = ['#quick-actions', '.section-header'];
            selectors.forEach((sel) => {
              container.querySelectorAll(sel).forEach((el) => {
                if (!(el instanceof HTMLElement)) return;
                if (el.offsetParent === null || el.offsetHeight === 0) return;
                const bottom = el.offsetTop + el.offsetHeight;
                if (bottom > maxBottom) maxBottom = bottom;
              });
            });
          } else {
            // Normal calculation for expanded sections
            const selectors = [
              '#quick-actions',
              '.section-header',
              '.color-grid-container', 
              '.anchors-container'
            ];
            selectors.forEach((sel) => {
              container.querySelectorAll(sel).forEach((el) => {
                if (!(el instanceof HTMLElement)) return;
                if (el.offsetParent === null || el.offsetHeight === 0) return;
                // Skip any element inside a collapsed section
                const insideCollapsed = el.closest('.collapsible-content.collapsed');
                if (insideCollapsed) return;
                const bottom = el.offsetTop + el.offsetHeight;
                if (bottom > maxBottom) maxBottom = bottom;
              });
            });
          }
          
          if (maxBottom === 0) {
            maxBottom = container.scrollHeight;
          }
          return Math.ceil(maxBottom);
        }

        const minHeight = 150; // align with collapsed sections height
        const maxHeight = 720;
        const footerHeight = 20; // fixed footer
        const bottomPx = computeVisibleContentBottomPx(scrollable);
        const desired = bottomPx + footerHeight;
        const clamped = Math.max(minHeight, Math.min(maxHeight, desired));
        sendMessage('resize-ui', { width: 188, height: clamped });
      } catch (_) {
        // no-op
      }
    });
    
    // Collapsibles
    document.querySelectorAll('.collapsible').forEach(header => {
      header.addEventListener('click', () => toggleCollapsible(header));
    });
    
    // Add click handler to detect and recover from collapsed state
    document.body.addEventListener('click', (e) => {
      // If user clicks anywhere and we're in a collapsed state, try to recover
      setTimeout(() => {
        checkAndRecoverFromCollapsedState();
      }, 50);
    });
  }

  function checkAndRecoverFromCollapsedState() {
    try {
      // Check if plugin is in a collapsed state (very narrow or all sections collapsed)
      const currentWidth = window.innerWidth;
      const allSections = document.querySelectorAll('.collapsible-content');
      const allCollapsed = Array.from(allSections).every(section => section.classList.contains('collapsed'));
      
      // If width is too narrow (less than 160px) or all sections are collapsed, recover
      if (currentWidth < 160 || allCollapsed) {
        console.log('Auto-recovering from collapsed state...');
        
        // Expand at least one section (Tags section)
        const tagsSection = document.getElementById('color-section');
        const tagsHeader = document.querySelector('[data-target="color-section"]');
        if (tagsSection && tagsHeader && tagsSection.classList.contains('collapsed')) {
          tagsSection.classList.remove('collapsed');
          const arrow = tagsHeader.querySelector('.arrow');
          if (arrow) {
            arrow.textContent = '-';
            tagsHeader.setAttribute('aria-expanded', 'true');
          }
        }
        
        // Ensure proper width
        sendMessage('resize-ui', { width: 188, height: Math.max(352, window.innerHeight) });
      }
    } catch (error) {
      console.log('Error in auto-recovery:', error);
    }
  }

  function setupResizeHandle() {
    const handle = document.getElementById('footer-resize');
    if (!handle) return;

    let isDragging = false;
    let startY = 0;
    let startHeight = 0;

    const minHeight = 150; // align with collapsed sections height
    const maxHeight = 720; // reasonable cap for plugin modal

    function onPointerDown(e) {
      isDragging = true;
      startY = e.clientY;
      // Use current container height (viewport height of plugin UI)
      startHeight = window.innerHeight;
      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', onPointerUp, { once: true });
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const delta = e.clientY - startY;
      let next = Math.max(minHeight, Math.min(maxHeight, startHeight + delta));
      // Send resize request to host (width fixed at 188)
      sendMessage('resize-ui', { width: 188, height: Math.round(next) });
    }

    function onPointerUp() {
      isDragging = false;
      document.removeEventListener('pointermove', onPointerMove);
    }

    handle.addEventListener('pointerdown', onPointerDown);

    // Keyboard accessible resizing (Up/Down arrows)
    handle.addEventListener('keydown', (e) => {
      const step = (e.shiftKey ? 40 : 20);
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        const delta = e.key === 'ArrowUp' ? -step : step;
        const next = Math.max(150, Math.min(maxHeight, window.innerHeight + delta)); // use collapsed sections height
        sendMessage('resize-ui', { width: 188, height: Math.round(next) });
        e.preventDefault();
      }
    });
  }

  // Removed layer collapse logic from quick action; see handleCollapseSections

  function handleAddDate() {
    sendMessage('add-date-smart');
  }

  function showTooltip(text, element) {
    if (!tooltip) return;
    
    const rect = element.getBoundingClientRect();
    tooltip.textContent = text;
    // Center horizontally under the button
    const tooltipWidth = tooltip.offsetWidth || 0;
    const left = rect.left + Math.max(0, (rect.width - tooltipWidth) / 2);
    tooltip.style.left = left + 'px';
    tooltip.style.top = (rect.bottom + 6) + 'px';
    tooltip.classList.add('visible');
  }

  function scheduleTooltip(text, element) {
    cancelTooltip();
    hoverTimer = setTimeout(() => {
      showTooltip(text, element);
    }, 200);
  }

  function cancelTooltip() {
    if (hoverTimer) {
      clearTimeout(hoverTimer);
      hoverTimer = null;
    }
    if (tooltip) {
      tooltip.classList.remove('visible');
    }
  }



  function renderEmojiButtons(emojis) {
    const container = document.getElementById('color-emoji-buttons');
    if (!container) return;
    
    container.innerHTML = '';
    emojis.forEach(emoji => {
      const button = document.createElement('button');
      button.className = 'emoji-button';
      button.textContent = emoji;
      button.addEventListener('click', () => sendMessage('add-emoji', { emoji }));
      container.appendChild(button);
    });
  }

  function updateSelectionIndicator(hasSelection) {
    const tagsBadge = document.getElementById('tags-badge');
    const anchorsBadge = document.getElementById('anchors-badge');
    const deselectBtn = document.getElementById('deselect-btn');
    const statusIndicator = document.getElementById('status-indicator');
    
    if (tagsBadge) {
      tagsBadge.textContent = '';
    }
    
    if (anchorsBadge) {
      anchorsBadge.textContent = '';
    }
    
    if (deselectBtn) {
      deselectBtn.disabled = !hasSelection;
    }

    // Update status indicator
    const isLayer = hasSelection;
    const label = isLayer ? 'onLayer' : 'onPage';

    if (statusIndicator) {
      statusIndicator.textContent = label;
    }
  }

  function toggleCollapsible(header) {
    const targetId = header.getAttribute('data-target');
    const content = document.getElementById(targetId);
    const arrow = header.querySelector('.arrow');
    
    if (!content || !arrow) return;
    
    const isCollapsed = content.classList.toggle('collapsed');
    arrow.textContent = isCollapsed ? '+' : '-';
    
    // Update ARIA attributes
    header.setAttribute('aria-expanded', !isCollapsed);
  }

  function renderBookmarks(bookmarks) {
    const list = document.getElementById('bookmark-list');
    if (!list) return;
    
    list.innerHTML = '';
    bookmarks.forEach((bookmark) => {
      const li = document.createElement('li');
      li.className = 'bookmark-item';
      const pageName = bookmark.pageName || 'Unknown Page';
      const truncatedPageName = truncatePageTitle(pageName);
      
      li.innerHTML = `
        <div class="bookmark-content">
          <span class="bookmark-name" title="${escapeHtml(bookmark.name)}">${escapeHtml(bookmark.name)}</span>
          <span class="bookmark-page" title="${escapeHtml(pageName)}">${escapeHtml(truncatedPageName)}</span>
        </div>
        <button class="bookmark-remove" title="Remove">×</button>
      `;
      
      li.querySelector('.bookmark-content')?.addEventListener('click', () => {
        sendMessage('jump-to-bookmark', { id: bookmark.id });
      });
      
      li.querySelector('.bookmark-remove')?.addEventListener('click', (event) => {
        event.stopPropagation();
        sendMessage('remove-bookmark', { id: bookmark.id });
      });
      
      list.appendChild(li);
    });
  }

  // Listen for messages from plugin
  window.addEventListener('message', (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    
    switch (msg.type) {
      case 'bookmarks':
        renderBookmarks(msg.bookmarks);
        break;
        
             case 'selection-state':
         hasLayerSelected = msg.hasLayerSelected;
         renderEmojiButtons(hasLayerSelected ? msg.layerEmojis : msg.pageEmojis);
         updateSelectionIndicator(hasLayerSelected);
         break;
        
      case 'show-tooltip':
        if (msg.elementId) {
          const element = document.getElementById(msg.elementId);
          if (element) showTooltip(msg.text, element);
        }
        break;
    }
  });
</script>
